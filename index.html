window.addEventListener('error', e => console.error('[app] runtime error:', e.message, e.filename, e.lineno));
window.addEventListener('unhandledrejection', e => console.error('[app] unhandled promise:', e.reason && e.reason.message || e.reason));

// AOS init
function initAOS(){
  if(typeof AOS === 'undefined') return;
  AOS.init({
    duration: 500,
    easing: 'ease-out',
    once: true,
    offset: 40,
    disable: () => window.matchMedia('(prefers-reduced-motion: reduce)').matches || !State.settings.animations,
  });
  document.documentElement.classList.add('aos-ready');
}
initAOS();

// Timer tick
setInterval(tickTimer, 250);

// Animasi hanya aktif bila pengguna tidak meminta reduced motion
if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches) document.documentElement.classList.add('motion');
applyTheme();
applyAccent();
document.addEventListener('visibilitychange', () => {
  document.documentElement.classList.toggle('paused', document.hidden);
});

// Jam: waktu perangkat, diperbarui tiap detik tanpa render ulang halaman
function is12h(){ return LS.get('clock12', false) === true; }
function clockTimeStr(d){ return d.toLocaleTimeString(locale(), { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12: is12h() }); }
function clockDateStr(d){ return d.toLocaleDateString(locale(), { weekday:'long', day:'numeric', month:'long', year:'numeric' }); }
function clockCard(){
  const d = new Date();
  const en = State.language === 'en';
  return `<section class="panel live-clock" aria-label="${en?'Digital clock':'Jam digital'}">
    <div>
      <div class="live-clock-time" id="tasks-clock-time">${clockTimeStr(d)}</div>
      <div class="live-clock-date" id="tasks-clock-date">${clockDateStr(d)}</div>
    </div>
    <button class="btn btn-sm" onclick="LS.set('clock12', !is12h()); render()">${is12h() ? (en?'Switch to 24-hour':'Ganti ke 24 jam') : (en?'Switch to 12-hour':'Ganti ke 12 jam')}</button>
  </section>`;
}
function updateClock(){
  const d = new Date();
  const a = document.getElementById('tasks-clock-time'); if(a) a.textContent = clockTimeStr(d);
  const b = document.getElementById('tasks-clock-date'); if(b) b.textContent = clockDateStr(d);
  const c = document.getElementById('topbar-date');
  if(c) c.innerHTML = `<span class="tb-d">${d.toLocaleDateString(locale(),{weekday:'short',month:'short',day:'numeric'})}</span><span class="tb-d"><br></span><span class="tb-t">${clockTimeStr(d)}</span>`;
}
if(!window.__clockTimer){ window.__clockTimer = setInterval(updateClock, 1000); }
if(!window.__alarmTimer){ window.__alarmTimer = setInterval(() => { try{ checkAlarms(); }catch(e){} }, 1000); }
updateClock();
document.addEventListener('visibilitychange', () => { if(!document.hidden) updateClock(); });

// Keyboard
document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); }
  if(e.key === 'Escape'){
    if(State.mobileOpen) closeMobileNav();
    else closeModal();
  }
});

// Init
State.activeNoteId = State.notes[0]?.id || null;
// Rekonsiliasi timer: sesi yang sudah habis saat aplikasi tertutup TIDAK otomatis dicatat sebagai selesai
let timerNotice = false;
if(State.timer && State.timer.running && State.timer.endAt && Date.now() >= State.timer.endAt){
  State.timer.running = false; State.timer.endAt = null; State.timer.remaining = 0; State.timer.completed = false;
  saveTimer();
  timerNotice = true;
}
try{
  render();
}catch(err){
  console.error('[init] gagal merender aplikasi:', err);
  const en = State.language === 'en';
  const root = document.getElementById('content') || document.body;
  root.innerHTML = `<div class="panel" style="padding:24px;margin:24px">
    <h2 class="t-section">${en ? 'The app could not start' : 'Aplikasi gagal dijalankan'}</h2>
    <p class="t-meta" style="margin:8px 0">${en ? 'Your data was not deleted. Open the browser console (F12) to see the error, then reload.' : 'Data kamu tidak dihapus. Buka konsol browser (F12) untuk melihat error, lalu muat ulang.'}</p>
    <p style="font-family:monospace;font-size:12px;word-break:break-word">${esc(String(err && err.message || err))}</p>
    <button class="btn" onclick="location.reload()">${en ? 'Reload' : 'Muat ulang'}</button>
  </div>`;
}
if(timerNotice){
  const en = State.language === 'en';
  toast(en ? 'A focus session ended while the app was closed and was not recorded.' : 'Sesi fokus habis saat aplikasi tertutup dan tidak dicatat.', 'error');
}
</script>
</body>
</html>
