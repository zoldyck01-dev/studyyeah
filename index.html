<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bilhatestudyright — Study Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
============================================================ */
:root{
  --bg:#F4F2ED;
  --surface:#FFFFFF;
  --surface-2:#E8E6E1;
  --text:#111111;
  --text-2:#666666;
  --text-3:#999999;
  --border:#D4D1CA;
  --border-strong:#111111;
  --dark:#111111;
  --dark-fg:#F4F2ED;
  --danger:#8B0000;
  --ok:#1E6B3A;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  --radius:0;
  --radius-pill:999px;

  --font-display:'Bebas Neue',Impact,sans-serif;
  --font-body:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
  --font-hand:'Caveat',cursive;
  --font-jp:'Noto Sans JP',sans-serif;

  --sidebar-w:240px;
  --sidebar-w-collapsed:64px;
  --topbar-h:56px;
  --content-max:1400px;

  --shadow-sm:2px 2px 0 0 var(--border-strong);
  --shadow-md:3px 3px 0 0 var(--border-strong);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font-body);font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.no-scroll{overflow:hidden}
button{font-family:inherit;cursor:pointer;background:none;border:0;color:inherit}
input,textarea,select{font-family:inherit;color:inherit}
img,svg{display:block;max-width:100%}
h1,h2,h3,h4{font-weight:normal;line-height:1.2}
a{color:inherit}
ul{list-style:none}
.icon svg{width:16px;height:16px;display:block}
.icon-sm svg{width:14px;height:14px}
.icon-lg svg{width:20px;height:20px}

/* Typography */
.t-page-title{font-family:var(--font-display);font-size:clamp(20px,2.5vw,24px);letter-spacing:.02em;text-transform:uppercase;line-height:1}
.t-page-heading{font-family:var(--font-display);font-size:clamp(28px,5vw,44px);letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.t-section{font-family:var(--font-display);font-size:17px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.t-body{font-size:13px;line-height:1.55;color:var(--text)}
.t-caption{font-size:12px;line-height:1.5;color:var(--text-2)}
.t-meta{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.t-hand{font-family:var(--font-hand);font-weight:700;color:var(--text)}
.t-jp{font-family:var(--font-jp);color:var(--text-2);font-size:11px}
.t-muted{color:var(--text-2)}
.t-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* ============================================================
   SHELL
============================================================ */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .25s ease}
.app.collapsed{grid-template-columns:var(--sidebar-w-collapsed) minmax(0,1fr)}
@media(max-width:1023px){.app{grid-template-columns:minmax(0,1fr)}}

/* Sidebar */
.sidebar{grid-column:1;background:var(--dark);color:var(--dark-fg);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden;z-index:50}
.sidebar-head{height:var(--topbar-h);display:flex;align-items:center;gap:var(--s2);padding:0 var(--s3);border-bottom:1px solid rgba(244,242,237,.15);flex-shrink:0}
.sidebar-logo{width:32px;height:32px;background:var(--dark-fg);color:var(--dark);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:20px;flex-shrink:0}
.sidebar-titles{flex:1;min-width:0;overflow:hidden}
.sidebar-titles strong{display:block;font-family:var(--font-display);font-size:15px;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-titles small{display:block;font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:rgba(244,242,237,.55);white-space:nowrap}
.sidebar-toggle{color:var(--dark-fg);padding:var(--s1);border:1px solid rgba(244,242,237,.3);display:none}
@media(min-width:1024px){.sidebar-toggle{display:flex}}
.sidebar-toggle:hover{background:rgba(244,242,237,.1)}
.sidebar-close{color:var(--dark-fg);padding:var(--s1);border:1px solid rgba(244,242,237,.3);display:flex}
@media(min-width:1024px){.sidebar-close{display:none}}
.app.collapsed .sidebar-titles{display:none}
.app.collapsed .sidebar-head{padding:0 var(--s2);justify-content:center;gap:var(--s1)}
.app.collapsed .sidebar-logo{margin:0 auto}

.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--s2) 0}
.nav-group{margin-bottom:var(--s3)}
.nav-group-title{font-family:var(--font-mono);font-size:9px;letter-spacing:.12em;color:rgba(244,242,237,.4);padding:var(--s2) var(--s3) var(--s1);text-transform:uppercase}
.app.collapsed .nav-group-title{display:none}
.app.collapsed .nav-group{margin-bottom:var(--s1)}
.nav-btn{display:flex;align-items:center;gap:var(--s2);width:100%;padding:var(--s2) var(--s3);border-left:3px solid transparent;color:rgba(244,242,237,.85);font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;text-align:left;transition:background .12s,color .12s;min-height:36px}
.nav-btn:hover{background:rgba(244,242,237,.08);color:var(--dark-fg)}
.nav-btn.active{background:var(--dark-fg);color:var(--dark);border-left-color:var(--dark-fg)}
.nav-btn .nav-icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:18px}
.nav-btn .nav-label{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-btn .nav-badge{font-family:var(--font-mono);font-size:9px;font-weight:600;padding:1px 6px;border-radius:var(--radius-pill);background:var(--dark-fg);color:var(--dark);min-width:18px;text-align:center}
.app.collapsed .nav-btn{justify-content:center;padding:var(--s2) var(--s1);gap:0}
.app.collapsed .nav-btn .nav-label,
.app.collapsed .nav-btn .nav-badge{display:none}
.sidebar-account{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.sidebar-account .who{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dark-fg,#F4F2ED);opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-account button{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border:1px solid rgba(244,242,237,.5);background:transparent;color:var(--dark-fg,#F4F2ED);cursor:pointer;align-self:flex-start}
.sidebar-account button:hover{background:rgba(244,242,237,.12)}
.sidebar-foot{padding:var(--s3);border-top:1px solid rgba(244,242,237,.15);font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:rgba(244,242,237,.45);text-align:center;line-height:1.4}
.app.collapsed .sidebar-foot{display:none}

/* Mobile drawer */
@media(max-width:1023px){
  .sidebar{position:fixed;left:0;top:0;bottom:auto;height:100vh;height:100dvh;width:min(84vw,320px);max-width:84vw;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:100}
  .sidebar.open{transform:translateX(0);box-shadow:4px 0 24px rgba(0,0,0,.3)}
}
.overlay{position:fixed;inset:0;background:rgba(17,17,17,.55);backdrop-filter:blur(2px);z-index:95;opacity:0;pointer-events:none;transition:opacity .28s ease}
.overlay.show{opacity:1;pointer-events:auto}

/* Main */
.main-col{display:flex;flex-direction:column;min-width:0;min-height:100vh}
.topbar{position:sticky;top:0;z-index:30;height:var(--topbar-h);background:var(--topbar-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);flex-shrink:0}
@media(max-width:479px){.topbar{padding:0 var(--s3);gap:var(--s1)}}
.menu-btn{display:flex;padding:var(--s1);border:1px solid var(--border);background:var(--surface);align-items:center;justify-content:center;color:var(--text)}
.menu-btn:hover{background:var(--bg)}
@media(min-width:1024px){.menu-btn{display:none}}
.topbar-title{flex:1;min-width:0;display:flex;align-items:baseline;gap:var(--s2);overflow:hidden}
.topbar-title{min-width:0}
.topbar-title .t-page-title{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:480px){.topbar-title .t-page-title{font-size:18px}.topbar-date{font-size:10px}.topbar-title{gap:8px}.lang-select{display:none}}
/* Di layar kecil pilihan bahasa ada di Pengaturan dan footer */
.topbar-title .topbar-sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:767px){.topbar-title .topbar-sub{display:none}}
.topbar-date{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;color:var(--text-2);text-align:right;line-height:1.3;white-space:nowrap;min-width:64px}
@media(max-width:767px){.topbar-date .tb-d{display:none}}
.lang-select{padding:var(--s1) var(--s2);border:1px solid var(--border);background:var(--surface);font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--text);outline:none;cursor:pointer;min-height:28px}
.lang-select:hover{background:var(--bg)}
.content{flex:1;padding:var(--s5);width:100%;max-width:var(--content-max);margin:0 auto;min-width:0}
@media(max-width:767px){.content{padding:var(--s4)}}
@media(max-width:479px){.content{padding:var(--s3)}}
.app-foot{border-top:1px solid var(--border);background:var(--bg);padding:var(--s3) var(--s5);display:flex;flex-direction:column;flex-wrap:wrap;justify-content:center;align-items:center;text-align:center;gap:var(--s2);font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--text-2);text-transform:uppercase}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s1);padding:var(--s2) var(--s3);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-family:var(--font-mono);font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;transition:background .12s,color .12s;min-height:32px}
.btn:hover:not(:disabled){background:var(--dark);color:var(--dark-fg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--dark);color:var(--dark-fg)}
.btn-primary:hover:not(:disabled){background:#333}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover:not(:disabled){background:var(--surface-2);border-color:var(--border-strong);color:var(--text)}
.btn-sm{padding:var(--s1) var(--s2);font-size:10px;min-height:26px}
.btn-icon{padding:var(--s1);min-width:28px;min-height:28px}

/* Form */
.field{display:flex;flex-direction:column;gap:var(--s1);margin-bottom:var(--s3)}
.field-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.input,.textarea,.select{width:100%;padding:var(--s2) var(--s3);border:1px solid var(--border-strong);background:var(--surface);font-family:var(--font-mono);font-size:12px;color:var(--text);outline:none;min-height:32px;transition:background .12s}
.input:focus,.textarea:focus,.select:focus{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--border-strong)}
.textarea{resize:vertical;min-height:64px;font-family:var(--font-body);font-size:13px;line-height:1.55}

/* Panel */
.panel{background:var(--surface);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;flex-wrap:wrap}
.panel-head .t-section{line-height:1}
.panel-head-right{display:flex;align-items:center;gap:var(--s1)}
.panel-body{padding:var(--s4)}
.panel-body.tight{padding:0}

/* Stat card */
.stat-card{background:var(--surface);border:1px solid var(--border);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.stat-card-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.stat-card-value{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--text)}
.stat-card-sub{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--s2);padding:var(--s6) var(--s3)}
.empty-icon{width:44px;height:44px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.empty-title{font-family:var(--font-display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--text)}
.empty-hint{font-size:12px;color:var(--text-2);max-width:280px;line-height:1.5}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:var(--s1);font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px var(--s2);border:1px solid var(--border);background:var(--surface-2);color:var(--text);white-space:nowrap}
.badge-dark{background:var(--dark);color:var(--dark-fg);border-color:var(--dark)}
.badge-soft{background:var(--bg);color:var(--text-2);border-color:var(--border)}
.badge-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.badge-danger{background:var(--danger);color:#fff;border-color:var(--danger)}

/* Grid */
.grid{display:grid;gap:var(--s4)}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1023px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:767px){.grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:var(--s4)}
.row{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.spacer{flex:1}

/* ============================================================
   DASHBOARD
============================================================ */
.dash-header{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s5)}
.dash-header .t-page-heading{line-height:1}
.dash-hero{background:var(--surface);border:2px solid var(--border-strong);display:grid;grid-template-columns:minmax(0,1fr) 300px;overflow:hidden;margin-bottom:var(--s5)}
@media(max-width:900px){.dash-hero{grid-template-columns:minmax(0,1fr)}}
.dash-hero-main{padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);position:relative;min-width:0}
.dash-hero-main::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(17,17,17,.06) 1px,transparent 1px);background-size:8px 8px;opacity:.5;z-index:0}
.dash-hero-main > *{position:relative;z-index:1}
.dash-hero-quote{font-family:var(--font-hand);font-size:20px;line-height:1.25;color:var(--text);max-width:460px}
.dash-hero-actions{display:flex;flex-wrap:wrap;gap:var(--s2)}
.dash-hero-side{background:var(--dark);color:var(--dark-fg);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);border-left:2px solid var(--border-strong);min-width:0}
@media(max-width:900px){.dash-hero-side{border-left:0;border-top:2px solid var(--border-strong)}}
.dash-hero-side-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(244,242,237,.6)}
.dash-hero-stat{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);padding:var(--s1) 0;font-family:var(--font-mono);font-size:11px}
.dash-hero-stat-label{color:rgba(244,242,237,.7);text-transform:uppercase;letter-spacing:.05em}
.dash-hero-stat-value{font-weight:600;font-size:13px;color:var(--dark-fg)}
.dash-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:var(--s4);align-items:start}
@media(max-width:1023px){.dash-layout{grid-template-columns:minmax(0,1fr)}}
.dash-main{display:flex;flex-direction:column;gap:var(--s4);min-width:0}
.dash-side{display:flex;flex-direction:column;gap:var(--s4);min-width:0}

/* Timer shortcut card */
.timer-shortcut{background:var(--surface);border:1px solid var(--border);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);align-items:center;text-align:center}
.timer-shortcut-display{font-family:var(--font-display);font-size:48px;line-height:1;font-variant-numeric:tabular-nums}

/* Row card */
.row-card{display:flex;align-items:flex-start;gap:var(--s2);padding:var(--s3);background:var(--surface);border:1px solid var(--border);transition:border-color .12s}
.row-card:hover{border-color:var(--border-strong)}
.row-card + .row-card{margin-top:-1px}
.row-card-main{flex:1;min-width:0}
.row-card-title{font-size:13px;font-weight:600;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-card-title.done{text-decoration:line-through;color:var(--text-2)}
.row-card-meta{font-family:var(--font-mono);font-size:10px;color:var(--text-2);margin-top:var(--s1);display:flex;flex-wrap:wrap;gap:var(--s2);letter-spacing:.03em}
.row-card-actions{display:flex;gap:var(--s1);opacity:0;transition:opacity .12s;flex-shrink:0}
.row-card:hover .row-card-actions{opacity:1}
@media(hover:none){.row-card-actions{opacity:1}}
.checkbox{width:18px;height:18px;border:1.5px solid var(--border-strong);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;color:var(--text);margin-top:1px}
.checkbox.checked{background:var(--dark);color:var(--dark-fg)}
.priority{font-family:var(--font-mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;padding:1px var(--s2);border:1px solid var(--border);background:var(--bg);white-space:nowrap}
.priority-med{background:var(--dark);color:var(--dark-fg);border-color:var(--dark)}
.priority-high{background:var(--dark);color:var(--dark-fg);border-color:var(--dark);font-weight:600}
.priority-low{background:var(--bg);color:var(--text-2)}
.due-badge{font-family:var(--font-mono);font-size:9px;letter-spacing:.04em;padding:1px var(--s2);border:1px solid var(--border);background:var(--bg);color:var(--text-2);text-transform:uppercase;white-space:nowrap}
.due-badge.overdue{border-color:var(--border-strong);background:var(--dark);color:var(--dark-fg)}

/* Filter bar */
.filter-bar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding:var(--s2);background:var(--surface);border:1px solid var(--border);margin-bottom:var(--s3)}
.chip{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;padding:var(--s1) var(--s2);border:1px solid var(--border);background:var(--surface);color:var(--text);transition:background .12s,color .12s,border-color .12s;white-space:nowrap;min-height:26px}
.chip:hover{background:var(--bg)}
.chip.active{background:var(--dark);color:var(--dark-fg);border-color:var(--dark)}

/* ============================================================
   NOTES
============================================================ */
.notes-layout{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:var(--s4);height:calc(100vh - var(--topbar-h) - var(--s5)*2 - 48px);min-height:520px}
@media(max-width:900px){.notes-layout{grid-template-columns:minmax(0,1fr);height:auto;min-height:auto}}
.notes-list{display:flex;flex-direction:column;border:1px solid var(--border);background:var(--surface);min-height:0;overflow:hidden}
@media(max-width:900px){.notes-list{max-height:320px}}
.notes-list-head{padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-shrink:0}
.notes-list-search{padding:var(--s2);border-bottom:1px solid var(--border);flex-shrink:0}
.notes-list-items{flex:1;overflow-y:auto;min-height:0}
.note-row{padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);border-left:3px solid transparent;cursor:pointer;background:transparent;text-align:left;width:100%;display:block;transition:background .12s}
.note-row:hover{background:var(--bg)}
.note-row.active{background:var(--bg);border-left-color:var(--border-strong)}
.note-row-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:var(--s1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-row-meta{font-family:var(--font-mono);font-size:10px;color:var(--text-2);margin-top:2px;display:flex;justify-content:space-between;gap:var(--s2)}
.notes-editor{display:flex;flex-direction:column;border:1px solid var(--border);background:var(--surface);min-height:0;overflow:hidden}
@media(max-width:900px){.notes-editor{min-height:440px}}
.notes-editor-head{padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;flex-shrink:0;background:var(--surface)}
.notes-editor-head .btn{min-height:26px;padding:var(--s1) var(--s2);font-size:10px}
.notes-editor-head .select{width:auto;min-height:26px;padding:0 var(--s2);font-size:10px}
.save-state{font-family:var(--font-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:2px var(--s2);border:1px solid var(--border);color:var(--text-2);background:var(--surface);margin-left:auto;white-space:nowrap}
.save-state.saving{background:var(--surface-2);color:var(--text);border-color:var(--border-strong)}
.save-state.saved{background:var(--dark);color:var(--dark-fg);border-color:var(--dark)}
.save-state.error{background:var(--danger);color:#fff;border-color:var(--danger)}
.note-title-input{padding:var(--s3) var(--s4);border:0;border-bottom:1px solid var(--border);background:var(--surface);font-family:var(--font-display);font-size:24px;letter-spacing:.01em;text-transform:uppercase;color:var(--text);outline:none;width:100%;flex-shrink:0}
.note-title-input::placeholder{color:var(--text-3)}
.note-toolbar{padding:var(--s1) var(--s3);border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:var(--s1);flex-wrap:nowrap;overflow-x:auto;flex-shrink:0}
.note-toolbar::-webkit-scrollbar{height:4px}
.note-toolbar button{padding:var(--s1) var(--s2);border:1px solid var(--border);background:var(--surface);font-size:11px;flex-shrink:0;min-height:24px;min-width:26px;display:inline-flex;align-items:center;justify-content:center}
.note-toolbar button:hover{background:var(--dark);color:var(--dark-fg);border-color:var(--dark)}
.note-wc{font-family:var(--font-mono);font-size:10px;color:var(--text-2);margin-left:auto;padding-left:var(--s2);white-space:nowrap;flex-shrink:0}
.note-textarea{flex:1;padding:var(--s4);border:0;outline:none;resize:none;background:var(--surface);font-family:var(--font-mono);font-size:13px;line-height:1.65;color:var(--text);min-height:200px}

/* ============================================================
   TIMER
============================================================ */
.timer-page{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s4);align-items:start}
@media(max-width:1023px){.timer-page{grid-template-columns:minmax(0,1fr)}}
.timer-card{border:2px solid var(--border-strong);background:var(--surface);display:flex;flex-direction:column}
.timer-card-head{background:var(--dark);color:var(--dark-fg);padding:var(--s2) var(--s4);display:flex;align-items:center;justify-content:space-between;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.timer-body{padding:var(--s6) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s4)}
.timer-display{font-family:var(--font-display);font-size:clamp(72px,14vw,128px);line-height:1;letter-spacing:.01em;text-align:center;font-variant-numeric:tabular-nums;color:var(--text);user-select:none}
.timer-bar{width:100%;max-width:420px;height:6px;background:var(--surface-2);border:1px solid var(--border-strong);overflow:hidden}
.timer-bar-fill{height:100%;background:var(--dark);transition:width .3s linear}
.timer-complete{font-family:var(--font-hand);font-size:20px;text-align:center;color:var(--text)}
.timer-controls{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center}
.timer-controls .btn{padding:var(--s2) var(--s4);min-height:38px;font-size:11px}
.timer-controls .btn-primary{padding:var(--s2) var(--s5)}
.timer-settings{width:100%;max-width:420px;display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media(max-width:479px){.timer-settings{grid-template-columns:1fr}}
.timer-focus-mode{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:var(--s4)}
.timer-focus-mode .timer-card{max-width:640px;width:100%}

/* ============================================================
   CALENDAR
============================================================ */
.cal-page{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s4);align-items:start}
@media(max-width:1023px){.cal-page{grid-template-columns:minmax(0,1fr)}}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap}
.cal-month{font-family:var(--font-display);font-size:20px;letter-spacing:.02em;text-transform:uppercase}
.cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border);background:var(--surface)}
.cal-weekdays div{text-align:center;padding:var(--s2) 0;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--text-2);text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--border);gap:1px}
.cal-day{background:var(--surface);min-height:88px;padding:var(--s1) var(--s2);text-align:left;display:flex;flex-direction:column;gap:var(--s1);cursor:pointer;transition:background .12s;min-width:0}
.cal-day:hover{background:var(--bg)}
.cal-day.blank{background:var(--bg);cursor:default}
.cal-day.selected{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--border-strong)}
@media(max-width:767px){.cal-day{min-height:64px;padding:2px 4px}}
.cal-day-num{font-family:var(--font-mono);font-size:11px;color:var(--text)}
.cal-day-num.today{background:var(--dark);color:var(--dark-fg);padding:0 4px;display:inline-block;border-radius:2px}
.cal-day-events{display:flex;flex-direction:column;gap:1px;overflow:hidden;min-width:0}
.cal-day-event{font-family:var(--font-mono);font-size:9px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cal-day-event.task{color:var(--text);font-weight:600}
.cal-day-count{font-family:var(--font-mono);font-size:9px;color:var(--text-2)}

/* ============================================================
   CALCULATOR
============================================================ */
.calc-page{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:var(--s4);align-items:start}
@media(max-width:1023px){.calc-page{grid-template-columns:minmax(0,1fr)}}
.calc-display{padding:var(--s4);border-bottom:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:flex-end;gap:var(--s1);min-height:100px}
.calc-expr{font-family:var(--font-mono);font-size:11px;color:var(--text-2);min-height:16px;word-break:break-all;text-align:right;width:100%}
.calc-result{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--text);word-break:break-all;text-align:right;width:100%}
.calc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s1);padding:var(--s2);background:var(--surface)}
.calc-btn{padding:var(--s3) 0;border:1px solid var(--border);background:var(--surface);font-family:var(--font-display);font-size:20px;color:var(--text);min-height:52px;transition:background .12s,color .12s}
.calc-btn:hover{background:var(--bg)}
.calc-btn.op{background:var(--surface-2);border-color:var(--border-strong)}
.calc-btn.op:hover{background:var(--dark);color:var(--dark-fg)}
.calc-btn.clear{background:var(--bg);color:var(--text)}
.calc-btn.clear:hover{background:var(--dark);color:var(--dark-fg)}
.calc-btn.eq{grid-column:1/-1;background:var(--dark);color:var(--dark-fg);border-color:var(--dark);font-size:22px}
.calc-btn.eq:hover{background:#333}
.acad-tabs{display:flex;flex-wrap:wrap;gap:var(--s1);margin-bottom:var(--s3)}
.acad-panel{background:var(--bg);border:1px solid var(--border);padding:var(--s3);font-family:var(--font-mono);font-size:12px;line-height:1.6}

/* ============================================================
   TRANSLATOR
============================================================ */
.translator-page{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--s4);max-width:960px;margin:0 auto}
.translator-controls{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.translator-langs{display:flex;align-items:center;gap:var(--s2);flex:1;min-width:0}
.translator-langs .select{width:auto;min-width:120px}
.translator-swap{padding:var(--s1);border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text);min-height:32px;min-width:32px}
.translator-swap:hover{background:var(--dark);color:var(--dark-fg)}
.translator-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border:1px solid var(--border);background:var(--border)}
@media(max-width:767px){.translator-grid{grid-template-columns:minmax(0,1fr)}}
.translator-panel{background:var(--surface);display:flex;flex-direction:column;min-height:240px}
.translator-panel-head{padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);background:var(--surface-2);flex-wrap:wrap}
.translator-textarea{flex:1;padding:var(--s3);border:0;outline:none;resize:none;background:var(--surface);font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--text);min-height:180px}
.translator-output{padding:var(--s3);font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--text);flex:1;word-wrap:break-word;overflow-wrap:break-word;white-space:pre-wrap}
.translator-output.error{color:var(--danger);font-family:var(--font-mono);font-size:12px}
.translator-output.loading{color:var(--text-2);font-style:italic}
.translator-foot{padding:var(--s2) var(--s3);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap}
.translator-notice{background:var(--bg);border:1px solid var(--border);padding:var(--s2) var(--s3);font-family:var(--font-mono);font-size:10px;color:var(--text-2);margin-top:var(--s3)}
.translator-history{padding:var(--s2) var(--s3)}
.translator-history-item{padding:var(--s2) 0;border-bottom:1px solid var(--border);cursor:pointer}
.translator-history-item:hover{background:var(--bg)}
.translator-history-item:last-child{border-bottom:0}

/* ============================================================
   FILES
============================================================ */
.files-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);padding:var(--s2);background:var(--surface);border:1px solid var(--border);margin-bottom:var(--s3)}
.files-toolbar-group{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap}
.dropzone{border:2px dashed var(--border);background:var(--surface);padding:var(--s5);text-align:center;transition:background .15s,border-color .15s;margin-bottom:var(--s3);cursor:pointer}
.dropzone:hover,.dropzone.drag-over{background:var(--bg);border-color:var(--border-strong)}
.dropzone-icon{margin:0 auto var(--s2);width:44px;height:44px;border:1px solid var(--border-strong);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.dropzone-title{font-family:var(--font-display);font-size:17px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:var(--s1)}
.dropzone-hint{font-family:var(--font-mono);font-size:11px;color:var(--text-2);margin-bottom:var(--s2)}
.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s3)}
@media(max-width:479px){.files-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
.file-card{background:var(--surface);border:1px solid var(--border);overflow:hidden;display:flex;flex-direction:column;transition:border-color .12s;min-width:0;cursor:pointer}
.file-card:hover{border-color:var(--border-strong)}
.file-thumb{aspect-ratio:4/3;background:var(--surface-2);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.file-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file-thumb-icon{color:var(--text-2)}
.file-card-body{padding:var(--s2) var(--s3);display:flex;flex-direction:column;gap:2px;min-width:0}
.file-card-name{font-size:12px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-card-meta{font-family:var(--font-mono);font-size:9px;color:var(--text-2);display:flex;justify-content:space-between;gap:var(--s1)}
.file-card-actions{display:flex;gap:var(--s1);padding:var(--s1) var(--s2) var(--s2)}
.file-card-actions .btn{flex:1;padding:2px 4px;min-height:24px;font-size:10px}
.files-list{background:var(--surface);border:1px solid var(--border);overflow:hidden}
.file-list-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-bottom:1px solid var(--border);transition:background .12s}
.file-list-row:hover{background:var(--bg)}
.file-list-row:last-child{border-bottom:0}
.file-list-icon{width:36px;height:36px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-2);overflow:hidden}
.file-list-icon img{width:100%;height:100%;object-fit:cover}
.file-list-main{flex:1;min-width:0}
.file-list-name{font-size:13px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-list-meta{font-family:var(--font-mono);font-size:10px;color:var(--text-2);display:flex;flex-wrap:wrap;gap:var(--s2)}
.file-list-actions{display:flex;gap:var(--s1);flex-shrink:0}
.folder-tabs{display:flex;flex-wrap:wrap;gap:var(--s1);margin-bottom:var(--s3)}
.storage-bar{height:6px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-top:var(--s1)}
.storage-bar-fill{height:100%;background:var(--dark)}

/* ============================================================
   NOTIFICATIONS / REFS / TRACKER (kept from prior)
============================================================ */
.notif-card{display:flex;gap:var(--s3);padding:var(--s3) var(--s4);background:var(--surface);border:1px solid var(--border);align-items:flex-start}
.notif-card.read{background:var(--surface);opacity:.75}
.notif-card.unread{border-left:3px solid var(--border-strong)}
.notif-card + .notif-card{margin-top:-1px}
.notif-icon{width:32px;height:32px;border:1px solid var(--border-strong);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0}
.notif-card.unread .notif-icon{background:var(--dark);color:var(--dark-fg)}
.notif-body{flex:1;min-width:0}
.notif-title-row{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s1);flex-wrap:wrap}
.notif-title{font-size:13px;font-weight:600;color:var(--text)}
.notif-desc{font-size:12px;line-height:1.5;color:var(--text-2);word-wrap:break-word;overflow-wrap:break-word}
.notif-date{font-family:var(--font-mono);font-size:10px;color:var(--text-2);margin-top:var(--s1)}
.notif-actions{display:flex;gap:var(--s1);flex-shrink:0}

.ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s3)}
.ref-card{background:var(--surface);border:1px solid var(--border);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);transition:border-color .12s;min-width:0}
.ref-card:hover{border-color:var(--border-strong)}
.ref-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s2)}
.ref-card-title{font-size:14px;font-weight:600;line-height:1.35;color:var(--text);word-wrap:break-word;overflow-wrap:break-word}
.ref-card-author{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}
.ref-card-desc{font-size:12px;line-height:1.5;color:var(--text-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-wrap:break-word}
.ref-card-url{font-family:var(--font-mono);font-size:10px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-card-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);padding-top:var(--s2);border-top:1px solid var(--border);margin-top:auto}
.ref-card-actions{display:flex;gap:var(--s1)}

.goal-card{background:var(--surface);border:1px solid var(--border);padding:var(--s4);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.goal-head{display:flex;justify-content:space-between;align-items:center}
.goal-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2)}
.goal-value{font-family:var(--font-display);font-size:28px;line-height:1;color:var(--text)}
.goal-value small{font-size:15px;color:var(--text-2)}
.goal-bar{height:6px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.goal-bar-fill{height:100%;background:var(--dark)}
.goal-pct{font-family:var(--font-mono);font-size:10px;color:var(--text-2);text-align:right}
.week-chart{display:flex;align-items:flex-end;gap:var(--s2);height:140px;padding:var(--s2) 0}
.week-chart-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:var(--s1);min-width:0}
.week-chart-val{font-family:var(--font-mono);font-size:9px;color:var(--text-2)}
.week-chart-bar{width:100%;background:var(--surface-2);border:1px solid var(--border);position:relative;min-height:4px}
.week-chart-bar-fill{position:absolute;inset:0;background:var(--dark)}
.week-chart-label{font-family:var(--font-mono);font-size:9px;text-transform:uppercase;color:var(--text-2)}
.subject-row{display:flex;justify-content:space-between;align-items:center;gap:var(--s2);margin-bottom:var(--s1)}
.subject-name{font-weight:600;font-size:13px}
.subject-meta{font-family:var(--font-mono);font-size:10px;color:var(--text-2)}
.subject-bar{height:5px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden;margin-bottom:var(--s3)}
.subject-bar-fill{height:100%;background:var(--dark)}

/* ============================================================
   MODAL / TOAST
============================================================ */
.modal-root{position:fixed;inset:0;z-index:200;pointer-events:none}
.modal-overlay{position:absolute;inset:0;background:rgba(17,17,17,.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:var(--s4);pointer-events:auto;overflow-y:auto}
.modal-box{background:var(--bg);border:2px solid var(--border-strong);box-shadow:var(--shadow-md);width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.modal-box.wide{max-width:720px}
.modal-box.xwide{max-width:960px}
.modal-head{background:var(--dark);color:var(--dark-fg);padding:var(--s2) var(--s4);display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-shrink:0}
.modal-head h2{font-family:var(--font-display);font-size:18px;letter-spacing:.03em;text-transform:uppercase}
.modal-close{color:var(--dark-fg);border:1px solid var(--dark-fg);padding:2px var(--s2);font-size:14px;line-height:1}
.modal-close:hover{background:var(--dark-fg);color:var(--dark)}
.modal-body{padding:var(--s4);overflow-y:auto;flex:1;min-height:0}
.modal-actions{display:flex;justify-content:flex-end;gap:var(--s2);padding-top:var(--s3);margin-top:var(--s3);border-top:1px solid var(--border)}
.file-preview{display:flex;align-items:center;justify-content:center;min-height:320px;background:var(--surface-2);border:1px solid var(--border);overflow:hidden}
.file-preview img{max-width:100%;max-height:60vh;object-fit:contain}
.file-preview iframe{width:100%;height:60vh;border:0;background:#fff}
.file-preview pre{width:100%;max-height:60vh;overflow:auto;padding:var(--s3);background:var(--surface);font-family:var(--font-mono);font-size:12px;line-height:1.6;color:var(--text);text-align:left;margin:0}

.toast-root{position:fixed;bottom:var(--s4);right:var(--s4);z-index:300;display:flex;flex-direction:column;gap:var(--s2);pointer-events:none;max-width:calc(100vw - 32px)}
.toast{background:var(--dark);color:var(--dark-fg);padding:var(--s2) var(--s4);border:1px solid var(--dark-fg);font-family:var(--font-mono);font-size:11px;letter-spacing:.03em;box-shadow:var(--shadow-sm);pointer-events:auto;animation:toastIn .2s ease;max-width:320px;word-wrap:break-word}
.toast.error{background:var(--danger);border-color:#fff}
.toast.success{background:var(--ok);border-color:#fff}
@keyframes toastIn{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}

.mt-2{margin-top:var(--s2)}.mt-3{margin-top:var(--s3)}.mt-4{margin-top:var(--s4)}.mt-5{margin-top:var(--s5)}
.mb-2{margin-bottom:var(--s2)}.mb-3{margin-bottom:var(--s3)}.mb-4{margin-bottom:var(--s4)}
.hidden{display:none !important}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  [data-aos]{opacity:1 !important;transform:none !important}
}
/* Konten tetap tampil jika AOS gagal dimuat (mis. CDN diblokir) */
html:not(.aos-ready) [data-aos]{opacity:1 !important;transform:none !important}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--text-2)}

/* ============ HERO ANIMATION (v4) ============ */
.dash-hero-quote .w{display:inline-block;margin-right:.25em}
html.motion .dash-hero-quote .w{opacity:0;animation:wordIn .5s ease-out forwards;animation-delay:var(--d,0ms)}
@keyframes wordIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.study-scene{width:100%;max-width:340px;margin:var(--s2) 0 0;display:flex;flex-direction:column;gap:var(--s1)}
.study-scene svg{width:100%;height:auto;display:block}
.study-scene-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-2)}
.study-scene-label b{color:var(--text);font-weight:600}
html.motion .scene-torso{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 4.2s ease-in-out infinite}
html.motion .scene-lamp{animation:lampGlow 5s ease-in-out infinite}
html.motion .scene-spark{animation:spark 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
@keyframes lampGlow{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes spark{0%,100%{opacity:.2;transform:translateY(0)}50%{opacity:.8;transform:translateY(-3px)}}
html.paused *{animation-play-state:paused !important}
@media(prefers-reduced-motion:reduce){html.motion .dash-hero-quote .w{animation:none;opacity:1}}

/* ============ AURA & FEEDBACK (v5) ============ */
body::before{content:'';position:fixed;inset:-20%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 25% 20%,rgba(17,17,17,.06),transparent 40%),radial-gradient(circle at 80% 75%,rgba(85,85,85,.08),transparent 45%);
  opacity:0;animation:auraIn 1.6s ease-out forwards}
@keyframes auraIn{to{opacity:1}}
@media(prefers-reduced-motion:reduce){body::before{animation:none;opacity:1}}
.toast{border-left:4px solid #F4F2ED;animation:toastSlide .3s cubic-bezier(.2,.7,.2,1) both;min-width:200px}
.toast.error{border-left-color:#fff}
@keyframes toastSlide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.toast{animation:none}}

/* ============ TEMA & ANIMASI (v8) ============ */
html[data-theme="black"]{
  --bg:#111111; --surface:#1B1B1B; --surface-2:#2A2A2A;
  --text:#F4F2ED; --border:#333333; --border-strong:#F4F2ED; --dark:#F4F2ED; --dark-fg:#111111; --text-2:#A8A7A2; --text-3:#777777;
}
html[data-theme="black"] body{background:var(--bg)}
html.motion .dash-hero-actions .btn{opacity:0;animation:riseIn .5s ease-out forwards}
html.motion .dash-hero-actions .btn:nth-child(1){animation-delay:.9s}
html.motion .dash-hero-actions .btn:nth-child(2){animation-delay:1.05s}
html.motion .dash-hero-actions .btn:nth-child(3){animation-delay:1.2s}
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
html.motion .dash-hero-quote{background-image:linear-gradient(var(--text),var(--text));background-repeat:no-repeat;background-position:0 100%;background-size:0 2px;animation:underlineIn 1s ease-out 1.1s forwards}
@keyframes underlineIn{to{background-size:100% 2px}}
.study-scene{position:relative;overflow:hidden}
html.motion .study-scene::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-100%);animation:sweep 7s ease-in-out infinite}
@keyframes sweep{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@media(prefers-reduced-motion:reduce){html.motion .dash-hero-actions .btn,html.motion .study-scene::after{animation:none;opacity:1}html.motion .dash-hero-quote{animation:none;background-size:100% 2px}}

/* ============ JAM DIGITAL (v13) ============ */
.live-clock{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s4);margin-bottom:var(--s4)}
.live-clock-time{font-family:var(--font-display);font-size:clamp(44px,8vw,72px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.live-clock-date{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-2);margin-top:var(--s1)}

/* ============ DRAWER HP (v28) ============ */
@media(max-width:1023px){
  .sidebar{height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
  .sidebar-head{flex-shrink:0}
  .sidebar-nav{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .sidebar-foot{flex-shrink:0}
}
/* ============ PERPUSTAKAAN (v28) ============ */
.book-card{padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2)}
.book-status{display:flex;gap:var(--s1);flex-wrap:wrap}
.book-status button{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border:2px solid var(--border-strong);background:transparent;color:var(--text)}
.book-status button[aria-pressed="true"]{background:var(--dark);color:var(--dark-fg)}

/* ============ TEMA (v37) ============ */
:root{--topbar-bg:rgba(244,242,237,.96)}
html[data-theme="black"]{
  --bg:#111111; --surface:#1B1B1B; --surface-2:#262626;
  --text:#F4F2ED; --text-2:#A8A7A2; --text-3:#7A7974;
  --border:#3A3A3A; --border-strong:#F4F2ED;
  --dark:#0B0B0B; --dark-fg:#F4F2ED;
  --topbar-bg:rgba(17,17,17,.96);
  color-scheme:dark;
}
html[data-theme="black"] .btn-primary{background:#F4F2ED;color:#111;border-color:#F4F2ED}
html[data-theme="black"] .btn-primary:hover{background:#D9D7D2}
html[data-theme="black"] .panel{box-shadow:4px 4px 0 0 #000}
html[data-theme="black"] .file-preview iframe{background:#1B1B1B}

/* ============ FOOTER (v39) ============ */
.app-foot{gap:var(--s4);padding:var(--s5) var(--s4)}
.foot-brand{font-family:var(--font-display);font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.foot-tag{font-family:var(--font-hand);font-size:18px;color:var(--text-2)}
.foot-groups{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s4) var(--s6);width:100%}
.foot-group{display:flex;flex-direction:column;align-items:center;gap:var(--s2)}
.foot-label{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-2)}
.seg{display:inline-flex;flex-wrap:wrap;justify-content:center;border:2px solid var(--border-strong);background:var(--surface)}
.seg button,.seg a{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 12px;min-width:64px;background:transparent;color:var(--text);border:0;border-right:2px solid var(--border-strong);text-decoration:none;cursor:pointer;line-height:1}
.seg > :last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--dark-fg)}
.seg a:hover,.seg button:hover{background:var(--surface-2)}
.seg [aria-disabled="true"]{opacity:.4;cursor:default}

/* ---- むちねこ ---- */
.mch-head{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.mch-title{font-family:'Noto Sans JP',sans-serif;font-weight:300;font-size:clamp(34px,6vw,52px);letter-spacing:.08em;margin:0;text-transform:none}
.mch-tag{font-family:'Noto Sans JP',sans-serif;margin:var(--s2) 0 var(--s3);font-size:15px}
.mch-canvas{width:100%;max-width:720px;display:block;border:2px solid #111;background:#F6F4EE;margin:0 auto;touch-action:none;cursor:pointer;box-shadow:6px 6px 0 #111}
.mch-bar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s4)}

.mch-track{flex:1;height:14px;border:2px solid #111;background:#E6E1D7;max-width:240px}
.mch-fill{height:100%;background:#111;width:0;transition:width .2s ease}
.mch-help{margin-top:var(--s3);line-height:1.6}

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
<script>
/* ============================================================
   1. UTILITIES
============================================================ */
const uid = () => Math.random().toString(36).slice(2,10);
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const isoAddDays = (iso,n) => { const d = new Date(iso+'T00:00'); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const locale = () => State.language === 'id' ? 'id-ID' : 'en-US';
const fmtDate = iso => iso ? new Date(iso+'T00:00').toLocaleDateString(locale(),{weekday:'short',month:'short',day:'numeric'}) : '';
const fmtDateLong = iso => iso ? new Date(iso+'T00:00').toLocaleDateString(locale(),{weekday:'long',month:'long',day:'numeric',year:'numeric'}) : '';
const fmtTime12 = t => { if(!t) return ''; const [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; return `${((h+11)%12)+1}:${String(m).padStart(2,'0')} ${ap}`; };
const fmtDur = sec => { const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60; return h>0?`${h}h ${m}m`: m>0?`${m}m ${s}s`:`${s}s`; };
const fmtBytes = b => { if(!b) return '0 B'; const k = 1024, u = ['B','KB','MB','GB']; const i = Math.min(u.length-1, Math.floor(Math.log(b)/Math.log(k))); return `${(b/Math.pow(k,i)).toFixed(1)} ${u[i]}`; };
const daysUntil = iso => Math.round((new Date(iso+'T00:00') - new Date(todayISO()+'T00:00'))/86400000);
// Tanggal lokal (YYYY-MM-DD) dari timestamp ISO; sebelumnya memakai tanggal UTC sehingga sesi tengah malam salah hari
function localDay(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const weekStartISO = iso => { const d = new Date(iso+'T00:00'); return isoAddDays(iso,-d.getDay()); };
const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const debounce = (fn,d) => { let t; const w = (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),d);}; w.cancel=()=>clearTimeout(t); return w; };
// ---- Suara: satu AudioContext, dibuka saat pengguna pertama menyentuh layar (agar tidak diblokir browser) ----
let audioCtx = null;
function getAudioCtx(){
  try{
    if(!audioCtx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; audioCtx = new C(); }
    if(audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    return audioCtx;
  }catch(e){ return null; }
}
['pointerdown','keydown','touchstart'].forEach(ev => document.addEventListener(ev, () => getAudioCtx(), { once:true, passive:true }));
function playTone(freq, when, dur, vol){
  const ctx = getAudioCtx(); if(!ctx) return;
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = 'sine'; osc.frequency.value = freq;
  osc.connect(g); g.connect(ctx.destination);
  const t0 = ctx.currentTime + when;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
// "ting-ting-ting" untuk timer selesai
const chime = () => { playTone(1318, 0, 0.5, 0.25); playTone(1568, 0.22, 0.5, 0.25); playTone(1318, 0.44, 0.7, 0.22); };
const beep = chime;
// Bunyi alarm berulang sampai dihentikan (maksimal 60 detik)
let alarmLoop = null;
function startAlarmSound(){
  stopAlarmSound(); chime();
  alarmLoop = setInterval(chime, 1600);
  setTimeout(stopAlarmSound, 60000);
}
function stopAlarmSound(){ if(alarmLoop){ clearInterval(alarmLoop); alarmLoop = null; } }

// Safe arithmetic (shunting-yard)
function safeEval(expr){
  if(!expr||!expr.trim()) return '';
  const cleaned = expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/\s+/g,'');
  const tokens = cleaned.match(/(\d+\.?\d*|\.\d+)|([+\-*/()])/g);
  if(!tokens) return 'Err';
  if(tokens.join('') !== cleaned) return 'Err';   // ada karakter tak dikenal
  const prec = {'+':1,'-':1,'*':2,'/':2};
  const out = [], ops = [];
  let expectOp = true;
  for(const t of tokens){
    if(/^[\d.]/.test(t)){ if(!expectOp) return 'Err'; out.push(parseFloat(t)); expectOp = false; }
    else if(t==='('){ ops.push('('); expectOp = true; }
    else if(t===')'){
      if(expectOp) return 'Err';
      while(ops.length && ops[ops.length-1]!=='(') out.push(ops.pop());
      if(!ops.length) return 'Err'; ops.pop();
    } else {
      if(expectOp && (t==='-'||t==='+')){ if(t==='-'){ out.push(-1); ops.push('*'); } continue; }
      while(ops.length && prec[ops[ops.length-1]]>=prec[t]) out.push(ops.pop());
      ops.push(t); expectOp = true;
    }
  }
  while(ops.length){ const op = ops.pop(); if(op==='(') return 'Err'; out.push(op); }
  const st = [];
  for(const t of out){
    if(typeof t==='number') st.push(t);
    else {
      const b = st.pop(), a = st.pop();
      if(a===undefined||b===undefined) return 'Err';
      if(t==='+') st.push(a+b);
      else if(t==='-') st.push(a-b);
      else if(t==='*') st.push(a*b);
      else if(t==='/'){ if(b===0) return '÷0'; st.push(a/b); }
    }
  }
  if(st.length === 0) return '';
  if(st.length !== 1) return 'Err';
  const r = st[0];
  return Number.isFinite(r) ? (Math.round(r*1e10)/1e10).toString() : 'Err';
}

/* ============================================================
   4. INDEXEDDB FILE STORE
============================================================ */
const FileDB = {
  db:null,
  open(){
    if(this.db) return Promise.resolve(this.db);
    return new Promise((resolve,reject)=>{
      const req = indexedDB.open('bsr-files',1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'id'});
        if(!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs',{keyPath:'id'});
      };
      req.onsuccess = e => { this.db = e.target.result; resolve(this.db); };
      req.onerror = e => reject(e);
    });
  },
  async putMeta(meta){
    const db = await this.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction('meta','readwrite');
      const r = tx.objectStore('meta').put(meta);
      r.onsuccess = () => res();
      r.onerror = e => rej(e);
    });
  },
  async putBlob(id, blob){
    const db = await this.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction('blobs','readwrite');
      const r = tx.objectStore('blobs').put({id, blob});
      r.onsuccess = () => res();
      r.onerror = e => rej(e);
    });
  },
  async getAllMeta(){
    const db = await this.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction('meta','readonly');
      const r = tx.objectStore('meta').getAll();
      r.onsuccess = () => res(r.result || []);
      r.onerror = e => rej(e);
    });
  },
  async getBlob(id){
    const db = await this.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction('blobs','readonly');
      const r = tx.objectStore('blobs').get(id);
      r.onsuccess = () => res(r.result ? r.result.blob : null);
      r.onerror = e => rej(e);
    });
  },
  async delete(id){
    const db = await this.open();
    return new Promise((res,rej)=>{
      const tx = db.transaction(['meta','blobs'],'readwrite');
      tx.objectStore('meta').delete(id);
      tx.objectStore('blobs').delete(id);
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e);
    });
  }
};

const THEME_PREFS = ['white','black','system'];
function resolveTheme(){
  const pref = THEME_PREFS.includes(LS.get('theme','white')) ? LS.get('theme','white') : 'white';
  if(pref === 'system'){
    const dark = !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
    return dark ? 'black' : 'white';
  }
  return pref;
}

/* Notifications */
function getNotifications(){
  const today = todayISO();
  const out = [];
  const s = State.settings;
  if(s.notifDeadlines){
    State.tasks.filter(task=>!task.completed && task.due).forEach(task=>{
      const d = daysUntil(task.due);
      if(d < 0) out.push({ id:'overdue:'+task.id, type:'overdue', title:t('notif.overdueTask'), body:task.title, when:task.due });
      else if(d === 0) out.push({ id:'due:'+task.id, type:'due', title:t('notif.dueToday'), body:task.title, when:task.due });
      else if(d <= 2) out.push({ id:'soon:'+task.id, type:'soon', title:`${t('notif.dueIn')} ${d} ${d>1?t('notif.days'):t('notif.day')}`, body:task.title, when:task.due });
    });
  }
  if(s.notifEvents){
    State.events.filter(e=>e.date === today && !e.completed).forEach(e=>{
      out.push({ id:'event:'+e.id, type:'event', title:t('notif.eventToday'), body:e.title + (e.start?' · '+fmtTime12(e.start):''), when:e.date });
    });
  }
  if(s.notifSessions){
    const has = State.sessions.some(x => localDay(x.endedAt) === today);
    if(!has) out.push({ id:'focus:'+today, type:'focus', title:t('notif.noFocusToday'), body:t('notif.noFocusHint'), when:today });
  }
  const order = { overdue:0, due:1, event:2, soon:3, focus:4 };
  return out.sort((a,b) => (order[a.type]??9) - (order[b.type]??9));
}
function getUnread(){ return getNotifications().filter(n => !State.readNotifIds.includes(n.id)); }

/* Shell render */
function render(){
  const _ae = document.activeElement;
  const _fid = _ae && _ae.id;
  const _caret = _ae && typeof _ae.selectionStart === 'number' ? _ae.selectionStart : null;
  const app = document.getElementById('app');
  app.classList.toggle('collapsed', State.collapsed);
  const sidebar = document.getElementById('sidebar');
  sidebar.classList.toggle('open', State.mobileOpen);
  document.getElementById('mobile-overlay').classList.toggle('show', State.mobileOpen);
  // collapse icon
  const collapseIcon = document.getElementById('collapse-icon');
  if(collapseIcon){
    collapseIcon.innerHTML = State.collapsed
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>';
  }
  // language select
  const langSel = document.getElementById('lang-select');
  if(langSel) langSel.value = State.language;
  // nav labels
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if(key === 'brand.tag' && el.closest('.sidebar-titles')) el.textContent = t(key);
    else if(key === 'shell.add') el.textContent = t(key);
    else if(key === 'brand.tag') el.textContent = t(key);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
  });
  renderSidebar();
  renderSidebarAccount();
  renderTopbar();
  renderPage();
  setTimeout(() => { try { (AOS.refreshHard || AOS.refresh)(); } catch(e){} }, 60);
  renderFooterWidgets();
  if(_fid){
    const _el = document.getElementById(_fid);
    if(_el){ _el.focus({preventScroll:true}); if(_caret !== null){ try{ _el.setSelectionRange(_caret,_caret); }catch(e){} } }
  }
}

function renderSidebar(){
  const unread = getUnread().length;
  document.getElementById('sidebar-nav').innerHTML = NAV_GROUPS.map(g => `
    <div class="nav-group">
      <div class="nav-group-title">${t(g.labelKey)}</div>
      ${g.items.map(id => {
        const isBadge = id === 'notifications' && unread > 0;
        return `<button class="nav-btn ${State.page===id?'active':''}" onclick="nav('${id}')" title="${esc(t('nav.'+id))}">
          <span class="nav-icon icon">${NAV_ICONS[id] || ''}</span>
          <span class="nav-label">${esc(t('nav.'+id))}</span>
          ${isBadge ? `<span class="nav-badge">${unread>9?'9+':unread}</span>` : ''}
        </button>`;
      }).join('')}
    </div>
  `).join('');
}
function renderSidebarAccount(){
  const el = document.getElementById('sidebar-account'); if(!el) return;
  const acc = LS.get('account', null);
  const en = State.language === 'en';
  if(acc && acc.name){
    el.hidden = false;
    el.innerHTML = `<div class="who" title="${esc(acc.name)}">${en?'Signed in':'Masuk'}: ${esc(acc.name)}</div><button type="button" onclick="accountLogout()">${en?'Sign out':'Keluar'}</button>`;
  } else { el.hidden = true; el.innerHTML = ''; }
}

function renderTopbar(){
  const meta = PAGE_META[State.page];
  document.getElementById('page-title').textContent = t(meta.titleKey);
  document.getElementById('page-sub').textContent = t(meta.subKey);
  const now = new Date();
  document.getElementById('topbar-date').innerHTML = `${now.toLocaleDateString(locale(),{weekday:'short',month:'short',day:'numeric'})}<br>${now.toLocaleTimeString(locale(),{hour:'2-digit',minute:'2-digit'})}`;
  const badge = document.getElementById('notif-badge');
  const unread = getUnread().length;
  if(unread > 0){ badge.textContent = unread > 9 ? '9+' : unread; badge.style.display = 'inline-block'; }
  else badge.style.display = 'none';
}

function renderPage(){
  const fn = {
    dashboard: renderDashboard, schedule: renderSchedule, tasks: renderTasks,
    calendar: renderCalendar, notes: renderNotes, timer: renderTimer,
    calculator: renderCalculator, translator: renderTranslator, files: renderFiles,
    references: renderReferences, tracker: renderTracker, notifications: renderNotifications,
    settings: renderSettings, reviews: renderReviews, guide: renderGuide, about: renderAbout, filetools: renderFileTools, books: renderBooks, music: renderMusic, alarm: renderAlarm, muchineko: renderMuchineko,
  }[State.page];
  let _html;
  try {
    _html = fn ? fn() : '';
  } catch(err) {
    console.error('[render]', State.page, err);
    _html = `<div class="panel" style="padding:var(--s4)">
      <h3 class="t-section">Halaman gagal ditampilkan</h3>
      <p class="t-meta" style="margin:var(--s2) 0">Data kamu tidak dihapus. Coba muat ulang halaman ini.</p>
      <button class="btn" onclick="render()">Coba lagi</button>
    </div>`;
  }
  document.getElementById('content').innerHTML = _html;
  // Post-render hooks
  if(State.page === 'files') setTimeout(setupDropzone, 30);
  if(State.page === 'notes') setTimeout(() => {
    const input = document.getElementById('note-content');
    if(input && State.activeNoteId && !input.value){ /* no-op */ }
  }, 20);
}

  const action = opts.action ? `<div class="panel-head-right">${opts.action}</div>` : '';

    <div class="panel-body ${opts.tight?'tight':''}">${body}</div>
  </section>`;
}

function renderSchedule(){
  const view = State.scheduleView;
  const date = State.scheduleDate;
  let list = State.events;
  let grouped = {};
  if(view === 'day') list = list.filter(e => e.date === date);
  else if(view === 'week'){
    const start = weekStartISO(date), end = isoAddDays(start,6);
    list = list.filter(e => e.date >= start && e.date <= end);
  }
  list = [...list].sort((a,b)=>{
    if(a.date !== b.date) return a.date.localeCompare(b.date);
    return (a.start||'').localeCompare(b.start||'');
  });
  list.forEach(e => { (grouped[e.date] = grouped[e.date] || []).push(e); });

  return `
    <div class="filter-bar" data-aos="fade-up">
      <div class="row" style="gap:var(--s1)">
        ${['day','week','all'].map(v=>`<button class="chip ${view===v?'active':''}" onclick="setSchedView('${v}')">${t('schedule.'+v)}</button>`).join('')}
      </div>
      <div class="row" style="gap:var(--s1)">
        <button class="btn btn-icon" onclick="shiftSchedDate(${view==='week'?-7:-1})" aria-label="Previous">◀</button>
        <input type="date" class="input" style="width:auto" value="${date}" onchange="setSchedDate(this.value)">
        <button class="btn btn-icon" onclick="shiftSchedDate(${view==='week'?7:1})" aria-label="Next">▶</button>
        <button class="btn btn-sm" onclick="setSchedDate('${todayISO()}')">${t('schedule.today')}</button>
      </div>
      <div class="spacer"></div>
      <button class="btn btn-primary" onclick="openEventModal()"><span class="icon icon-sm">${ICONS.plus}</span> ${t('schedule.new')}</button>
    </div>

    ${view === 'day' ? `
      <div class="panel mb-3" data-aos="fade-up">
        <div class="panel-body" style="display:flex;justify-content:space-between;align-items:center;gap:var(--s2);flex-wrap:wrap">
          <div>
            <p class="t-meta">${t('schedule.selected')}</p>
            <p class="t-section">${fmtDate(date)}</p>
          </div>
          <p class="t-meta">${list.length} ${t('schedule.events')} · ${list.filter(e=>e.completed).length} ${t('tasks.done')}</p>
        </div>
      </div>
      <div data-aos="fade-up">${eventList(list)}</div>
    ` : view === 'week' ? `
      ${Object.keys(grouped).sort().map(d=>`
        <div class="panel mb-3" data-aos="fade-up">
          <header class="panel-head"><h3 class="t-section">${fmtDate(d)}</h3><span class="t-meta">${grouped[d].length} ${t('schedule.events')}</span></header>
          <div class="panel-body tight">${grouped[d].length ? eventList(grouped[d],true) : `<p class="t-meta" style="padding:var(--s3)">${t('schedule.noEvents')}</p>`}</div>
        </div>
      `).join('') || `<div class="panel">${empty(ICONS.calendar, t('schedule.noEventsWeek'), t('schedule.empty.hint'))}</div>`}
    ` : `<div data-aos="fade-up">${eventList(list,false,true)}</div>`}
  `;
}

      <div class="modal-actions">

        <button type="submit" class="btn btn-primary">${t('common.save')}</button>

    </form>
  `);

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^\d{2}:\d{2}$/;
function eventValidationError(d){
  const en = State.language === 'en';
  if(!d.title) return en ? 'Title is required.' : 'Judul wajib diisi.';
  if(!DATE_RE.test(d.date) || isNaN(new Date(d.date+'T00:00:00').getTime())) return en ? 'Pick a valid date.' : 'Pilih tanggal yang valid.';
  if(d.start && !TIME_RE.test(d.start)) return en ? 'Start time is invalid.' : 'Jam mulai tidak valid.';
  if(d.end && !TIME_RE.test(d.end)) return en ? 'End time is invalid.' : 'Jam selesai tidak valid.';
  if(d.start && d.end && d.end <= d.start) return en ? 'End time must be after start time (overnight events are not supported).' : 'Jam selesai harus setelah jam mulai (acara lewat tengah malam belum didukung).';
  return null;
}
// Bentrok: dua interval pada tanggal yang sama saling tumpang tindih
function findEventConflicts(d, selfId){
  if(!d.start || !d.end) return [];
  return State.events.filter(x => x.id !== selfId && x.date === d.date && x.start && x.end &&
    d.start < x.end && d.end > x.start);
}
function saveEvent(e, id){
  e.preventDefault();
  const f = e.target;
  const data = {
    title:f.title.value.trim(), date:f.date.value,
    start:f.start.value, end:f.end.value,
    subject:f.subject.value, location:f.location.value,
    description:f.description.value,
    completed:id ? State.events.find(x=>x.id===id)?.completed || false : false,
  };
  const err = eventValidationError(data);
  if(err){ toast(err, 'error'); return; }          // modal tetap terbuka, isian tidak hilang
  const conflicts = findEventConflicts(data, id);
  if(id){ const i = State.events.findIndex(x=>x.id===id); if(i>=0) State.events[i] = {...State.events[i],...data}; }
  else State.events.push({ id:uid(), ...data, createdAt:Date.now() });
  saveEvents(); closeModal(); render();
  const en = State.language === 'en';
  if(conflicts.length) toast(en ? `Saved, but it overlaps ${conflicts.length} other event(s).` : `Tersimpan, tapi bentrok dengan ${conflicts.length} acara lain.`, 'error');
  else toast(en ? 'Saved' : 'Tersimpan', 'success');
}
function deleteEvent(id){
  confirmDialog(t('common.confirmDelete'), t('common.confirmDeleteBody'), ()=>{
    State.events = State.events.filter(e=>e.id!==id);
    saveEvents(); render(); toast('Deleted','success');
  });
}

/* ============================================================

============================================================ */
function renderTasks(){
  const today = todayISO();
  let list = [...State.tasks];
  const f = State.tasksFilter, q = State.tasksSearch.toLowerCase();
  if(f === 'today') list = list.filter(t=>!t.completed && t.due === today);
  else if(f === 'upcoming') list = list.filter(t=>!t.completed && t.due && t.due > today);
  else if(f === 'overdue') list = list.filter(t=>!t.completed && t.due && t.due < today);
  else if(f === 'completed') list = list.filter(t=>t.completed);
  if(q) list = list.filter(t=>(t.title||'').toLowerCase().includes(q));
  const priRank = { high:0, med:1, low:2 };
  list.sort((a,b)=>{
    if(a.completed !== b.completed) return a.completed ? 1 : -1;
    if(a.due && b.due && a.due !== b.due) return a.due.localeCompare(b.due);
    return (priRank[a.priority]??1) - (priRank[b.priority]??1);
  });
  const done = State.tasks.filter(t=>t.completed).length;
  const pct = State.tasks.length ? Math.round(done/State.tasks.length*100) : 0;

  return `
    ${clockCard()}
    <div class="filter-bar" data-aos="fade-up">
      <div class="row" style="gap:var(--s2)">
        <span class="badge badge-dark">${State.tasks.length} ${t('tasks.count')}</span>
        <span class="t-meta">${done} ${t('tasks.done')} · ${State.tasks.length - done} ${t('tasks.open')}</span>
      </div>
      <div class="spacer"></div>
      <div style="max-width:200px;flex:1;min-width:120px">
        <div class="goal-bar"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
        <p class="t-meta" style="text-align:right;margin-top:2px">${pct}% ${t('tasks.complete')}</p>
      </div>
      <button class="btn btn-primary" onclick="openTaskModal()"><span class="icon icon-sm">${ICONS.plus}</span> ${t('tasks.new')}</button>
    </div>

    <div class="row mb-3" style="gap:var(--s1)" data-aos="fade-up">
      ${[['all',t('filter.all')],['today',t('filter.today')],['upcoming',t('filter.upcoming')],['overdue',t('filter.overdue')],['completed',t('filter.completed')]]
        .map(([k,l])=>`<button class="chip ${f===k?'active':''}" onclick="setTaskFilter('${k}')">${l}</button>`).join('')}
      <div class="spacer"></div>
      <input class="input" placeholder="${t('tasks.searchPlaceholder')}" value="${esc(State.tasksSearch)}" oninput="State.tasksSearch=this.value;renderTasksOnly()" style="max-width:220px;width:100%">
    </div>

    <div id="tasks-list">
      ${list.length === 0 ? `<div class="panel">${empty(ICONS.check, t('tasks.empty.title'), t('tasks.empty.hint'))}</div>` : list.map(t_=>{
        const overdue = !t_.completed && t_.due && t_.due < today;
        return `
          <div class="row-card">
            <button class="checkbox ${t_.completed?'checked':''}" onclick="toggleTask('${t_.id}')" aria-label="Toggle">${t_.completed?'✓':''}</button>
            <div class="row-card-main">
              <p class="row-card-title ${t_.completed?'done':''} t-truncate">${esc(t_.title)}</p>
              <div class="row-card-meta">
                ${t_.due?`<span class="due-badge ${overdue?'overdue':''}">${t_.due===today?t('filter.today'):fmtDate(t_.due)}</span>`:''}
                ${t_.subject?`<span>#${esc(t_.subject)}</span>`:''}
                ${t_.estimatedMin?`<span>~${t_.estimatedMin}m</span>`:''}
              </div>
              ${t_.description?`<p class="t-caption mt-2">${esc(t_.description)}</p>`:''}
            </div>
            ${priorityBadge(t_.priority)}
            <div class="row-card-actions">
              <button class="btn btn-sm" onclick="openTaskModal('${t_.id}')" aria-label="Edit"><span class="icon icon-sm">${ICONS.edit}</span></button>
              <button class="btn btn-sm" onclick="deleteTask('${t_.id}')" aria-label="Delete"><span class="icon icon-sm">${ICONS.trash}</span></button>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}
function renderTasksOnly(){ render(); }
function setTaskFilter(f){ State.tasksFilter = f; render(); }
function toggleTask(id){
  const t_ = State.tasks.find(x=>x.id===id);
  if(!t_) return;
  t_.completed = !t_.completed;
  t_.completedAt = t_.completed ? new Date().toISOString() : null;
  saveTasks(); render();
}
function deleteTask(id){
  confirmDialog(t('common.confirmDelete'), t('common.confirmDeleteBody'), ()=>{
    State.tasks = State.tasks.filter(x=>x.id!==id);
    saveTasks(); render(); toast('Deleted','success');
  });
}
function openTaskModal(id){

function saveTask(e, id){
  e.preventDefault();
  const f = e.target;
  const data = { title:f.title.value.trim(), description:f.description.value, subject:f.subject.value, priority:f.priority.value, due:f.due.value, estimatedMin:f.estimatedMin.value };
  if(id){ const i = State.tasks.findIndex(x=>x.id===id); if(i>=0) State.tasks[i] = {...State.tasks[i], ...data}; }
  else State.tasks.push({ id:uid(), ...data, completed:false, createdAt:Date.now() });
  saveTasks(); closeModal(); render(); toast('Saved','success');
}

let noteSaveTimer = null;
function setSaveState(s){
  const el = document.getElementById('note-save-state');
  if(!el) return;
  const labels = { saved:t('notes.saved'), saving:t('notes.saving'), error:t('notes.error'), idle:t('notes.ready') };
  el.textContent = labels[s] || t('notes.ready');
  el.className = 'save-state ' + s;
  el.onclick = s === 'error' ? () => flushNoteSave() : null;
  el.title = s === 'error' ? (State.language==='en' ? 'Click to retry saving' : 'Klik untuk coba simpan lagi') : '';
}
// Draft ditulis segera setiap ketik, supaya tidak hilang saat refresh sebelum autosave
function scheduleNoteSave(){
  const n = State.notes.find(x=>x.id===State.activeNoteId);
  if(n) LS.trySet('noteDraft', { id:n.id, title:n.title||'', content:n.content||'', at:Date.now() });
  setSaveState('saving');
  clearTimeout(noteSaveTimer);
  noteSaveTimer = setTimeout(flushNoteSave, 500);
}
function flushNoteSave(){
  clearTimeout(noteSaveTimer); noteSaveTimer = null;
  const ok = saveNotes();
  if(ok){ LS.remove('noteDraft'); setSaveState('saved'); }
  else setSaveState('error');
  return ok;
}
// Simpan yang tertunda sebelum halaman ditutup
window.addEventListener('beforeunload', () => { if(noteSaveTimer) flushNoteSave(); });

// Pemulihan draft: hanya ditawarkan, tidak pernah menimpa catatan tanpa persetujuan
function noteDraftBanner(){
  const d = LS.get('noteDraft', null);
  if(!d) return '';
  const n = State.notes.find(x=>x.id===d.id);
  if(!n || (n.content===d.content && n.title===d.title)) return '';
  const en = State.language === 'en';
  return `<div class="panel" role="status" style="padding:var(--s3);margin-bottom:var(--s3);display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center">
    <span class="t-meta" style="flex:1 1 220px">${en ? 'An unsaved draft of this note was found.' : 'Ada draft yang belum tersimpan untuk catatan ini.'}</span>
    <button class="btn btn-sm" onclick="restoreNoteDraft()">${en ? 'Restore draft' : 'Pulihkan draft'}</button>
    <button class="btn btn-sm" onclick="discardNoteDraft()">${en ? 'Discard' : 'Buang'}</button>
  </div>`;
}
function restoreNoteDraft(){
  const d = LS.get('noteDraft', null);
  const n = d && State.notes.find(x=>x.id===d.id);
  if(!n){ LS.remove('noteDraft'); render(); return; }
  n.title = d.title; n.content = d.content; n.updatedAt = Date.now();
  if(saveNotes()){ LS.remove('noteDraft'); toast(State.language==='en'?'Draft restored.':'Draft dipulihkan.','success'); }
  else toast(State.language==='en'?'Could not save the restored draft.':'Draft gagal disimpan.','error');
  render();
}
function discardNoteDraft(){ LS.remove('noteDraft'); render(); }
function renderNotes(){
  return noteDraftBanner() + renderNotesBase();
}
function renderNotesBase(){
  if(!State.activeNoteId && State.notes.length) State.activeNoteId = State.notes[0].id;

  const filtered = State.notes.filter(n =>

  ).sort((a,b)=>{

    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  const active = State.notes.find(n=>n.id===State.activeNoteId) || null;

  const cc = active ? (active.content||'').length : 0;

  return `

        <div class="notes-list-search">

        <div class="notes-list-items" id="notes-list-items">
          ${filtered.length===0 ? `<div style="padding:var(--s3)">${empty(ICONS.notes, t('notes.empty.title'), t('notes.empty.hint'))}</div>` : filtered.map(n=>`
            <button class="note-row ${n.id===State.activeNoteId?'active':''}" onclick="selectNote('${n.id}')">
              <div class="note-row-title">${n.pinned?'📌 ':''}${esc(n.title||t('notes.untitled'))}</div>
              <div class="note-row-meta"><span>${esc(n.folder||'')}</span><span>${new Date(n.updatedAt||Date.now()).toLocaleDateString(locale())}</span></div>
            </button>
          `).join('')}
        </div>
      </aside>
      <section class="notes-editor" data-aos="fade-up">
        ${active ? `
          <div class="notes-editor-head">
            <button class="btn btn-sm" onclick="pinNote('${active.id}')" title="${t('notes.pin')}"><span class="icon icon-sm">${ICONS.pin}</span></button>
            <button class="btn btn-sm" onclick="duplicateNote('${active.id}')" title="${t('notes.duplicate')}"><span class="icon icon-sm">${ICONS.copy}</span></button>
