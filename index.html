            <button class="btn btn-sm" onclick="deleteNote('${active.id}')" title="${t('notes.delete')}"><span class="icon icon-sm">${ICONS.trash}</span></button>
            <select class="select" onchange="changeNoteFolder('${active.id}', this.value)">
              ${State.subjects.map(s=>`<option value="${esc(s)}" ${active.folder===s?'selected':''}>${esc(s)}</option>`).join('')}
            </select>
            <span class="save-state saved" id="note-save-state">${t('notes.ready')}</span>

            <button onclick="insertMarkdown('italic')" title="Italic"><i>I</i></button>
            <button onclick="insertMarkdown('bullet')" title="Bullets">•</button>
            <button onclick="insertMarkdown('numbered')" title="Numbered">1.</button>
            <button onclick="insertMarkdown('check')" title="Checklist">☑</button>
            <button onclick="insertMarkdown('link')" title="Link">🔗</button>
            <span class="note-wc" id="note-wc">${wc} ${t('notes.words')} · ${cc} ${t('notes.chars')}</span>
          </div>

        ` : `<div class="empty"><div class="empty-icon"><span class="icon-lg icon">${ICONS.notes}</span></div><p class="empty-title">${t('notes.selectNote')}</p><p class="empty-hint">${t('notes.selectHint')}</p></div>`}
      </section>
    </div>

}
function renderNotesList(){
  if(State.page !== 'notes') return;
  const list = document.getElementById('notes-list-items');
  if(!list) return;
  const search = State.notesSearch.toLowerCase();
  const filtered = State.notes.filter(n =>
    !search || (n.title||'').toLowerCase().includes(search) || (n.content||'').toLowerCase().includes(search)
  ).sort((a,b)=>{
    if(a.pinned !== b.pinned) return a.pinned?-1:1;
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
  list.innerHTML = filtered.length === 0
    ? `<div style="padding:var(--s3)">${empty(ICONS.notes, t('notes.empty.title'), t('notes.empty.hint'))}</div>`
    : filtered.map(n=>`
      <button class="note-row ${n.id===State.activeNoteId?'active':''}" onclick="selectNote('${n.id}')">
        <div class="note-row-title">${n.pinned?'📌 ':''}${esc(n.title||t('notes.untitled'))}</div>
        <div class="note-row-meta"><span>${esc(n.folder||'')}</span><span>${new Date(n.updatedAt||Date.now()).toLocaleDateString(locale())}</span></div>
      </button>
    `).join('');
}
function selectNote(id){ State.activeNoteId = id; render(); setTimeout(()=>document.getElementById('note-content')?.focus(), 30); }
function onNoteTitleInput(v){
  const n = State.notes.find(x=>x.id===State.activeNoteId);
  if(!n) return;
  n.title = v; n.updatedAt = Date.now();
  scheduleNoteSave();
  const item = document.querySelector('.note-row.active .note-row-title');
  if(item) item.innerHTML = (n.pinned?'📌 ':'') + esc(n.title || t('notes.untitled'));
}
function onNoteContentInput(v){
  const n = State.notes.find(x=>x.id===State.activeNoteId);
  if(!n) return;
  n.content = v; n.updatedAt = Date.now();
  scheduleNoteSave();
  const wc = document.getElementById('note-wc');
  if(wc) wc.textContent = `${v.trim().split(/\s+/).filter(Boolean).length} ${t('notes.words')} · ${v.length} ${t('notes.chars')}`;
}
function pinNote(id){
  const n = State.notes.find(x=>x.id===id);
  if(!n) return;
  n.pinned = !n.pinned; saveNotes(); renderNotesList();
  toast(n.pinned?'Pinned':'Unpinned','success');
}
function createNote(){
  const id = uid();
  State.notes.unshift({ id, title:t('notes.untitled'), content:'', folder:State.subjects[0]||'Personal Notes', pinned:false, createdAt:Date.now(), updatedAt:Date.now() });
  saveNotes(); State.activeNoteId = id; render();
  setTimeout(()=>document.getElementById('note-title-input')?.focus(), 30);
}
function duplicateNote(id){
  const n = State.notes.find(x=>x.id===id);
  if(!n) return;
  const copy = { ...n, id:uid(), title:n.title+' (copy)', createdAt:Date.now(), updatedAt:Date.now(), pinned:false };
  State.notes.unshift(copy); saveNotes(); State.activeNoteId = copy.id; render();
}
function deleteNote(id){
  confirmDialog(t('common.confirmDelete'), t('common.confirmDeleteBody'), ()=>{
    State.notes = State.notes.filter(n=>n.id!==id);
    if(State.activeNoteId === id) State.activeNoteId = State.notes[0]?.id || null;
    saveNotes(); render(); toast('Deleted','success');
  });
}
function exportNote(id){
  const n = State.notes.find(x=>x.id===id);
  if(!n) return;
  const blob = new Blob([`# ${n.title}\n\n${n.content}`], { type:'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (n.title||'note').replace(/[^\w]+/g,'_') + '.md';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function changeNoteFolder(id, folder){ const n = State.notes.find(x=>x.id===id); if(!n) return; n.folder = folder; saveNotes(); }
function insertMarkdown(kind){
  const ta = document.getElementById('note-content');
  if(!ta) return;
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.slice(start, end);
  let wrap = '';
  if(kind==='bold') wrap = `**${sel||'bold'}**`;
  else if(kind==='italic') wrap = `*${sel||'italic'}*`;
  else if(kind==='h1') wrap = `# ${sel||'Heading'}`;
  else if(kind==='h2') wrap = `## ${sel||'Heading'}`;
  else if(kind==='bullet') wrap = sel.split('\n').map(l=>`- ${l}`).join('\n') || '- item';
  else if(kind==='numbered') wrap = sel.split('\n').map((l,i)=>`${i+1}. ${l}`).join('\n') || '1. item';
  else if(kind==='check') wrap = sel.split('\n').map(l=>`- [ ] ${l}`).join('\n') || '- [ ] task';
  else if(kind==='link') wrap = `[${sel||'text'}](url)`;
  ta.value = ta.value.slice(0,start) + wrap + ta.value.slice(end);
  onNoteContentInput(ta.value);
  ta.focus();
  ta.setSelectionRange(start + wrap.length, start + wrap.length);
}

/* ============================================================
   10. TIMER
============================================================ */
function getModeDuration(mode){
  if(mode==='pomodoro') return State.settings.pomodoro*60;
  if(mode==='short') return State.settings.shortBreak*60;
  if(mode==='long') return State.settings.longBreak*60;
  if(mode==='custom') return (State.timer.customMin||30)*60;
  return State.settings.pomodoro*60;
}
function renderTimer(){
  if(State.timer.focus) return `<div class="timer-focus-mode">${timerCardHTML()}</div>`;
  const today = todayISO();
  const todaySessions = State.sessions.filter(s=>localDay(s.endedAt)===today);
  const todaySec = todaySessions.reduce((s,x)=>s+(x.duration||0),0);
  return `
    <div class="timer-page">
      <div data-aos="fade-up">${timerCardHTML()}</div>
      <div class="stack" data-aos="fade-left">
        ${panel(t('timer.today'), `
          <div class="dash-hero-stat"><span class="dash-hero-stat-label" style="color:var(--text-2)">${t('timer.sessions')}</span><span class="dash-hero-stat-value" style="color:var(--text)">${todaySessions.length}</span></div>
          <div class="dash-hero-stat"><span class="dash-hero-stat-label" style="color:var(--text-2)">${t('timer.focusTime')}</span><span class="dash-hero-stat-value" style="color:var(--text)">${fmtDur(todaySec)}</span></div>
          <div class="dash-hero-stat"><span class="dash-hero-stat-label" style="color:var(--text-2)">${t('timer.pomodoroLen')}</span><span class="dash-hero-stat-value" style="color:var(--text)">${State.settings.pomodoro}m</span></div>
        `)}
        ${panel(t('timer.history'), State.sessions.length ? `
          <div style="max-height:320px;overflow-y:auto">
            ${[...State.sessions].reverse().slice(0,20).map(s=>`
              <div class="row-card" style="padding:var(--s2)">
                <div class="row-card-main">
                  <p class="row-card-meta" style="margin:0">
                    <span>${new Date(s.endedAt).toLocaleString(locale(),{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</span>
                    ${s.subject?`<span>${esc(s.subject)}</span>`:''}
                  </p>
                </div>
                <span class="badge badge-soft">${fmtDur(s.duration)}</span>
              </div>
            `).join('')}
          </div>
        ` : empty(ICONS.timer, t('timer.empty.title'), t('timer.empty.hint')))}
      </div>
    </div>
  `;
}
function timerCardHTML(){
  const t_ = State.timer;
  const total = t_.total || getModeDuration(t_.mode);
  const pct = total ? Math.min(100, Math.max(0, (total - t_.remaining) / total * 100)) : 0;
  const mm = String(Math.floor(t_.remaining/60)).padStart(2,'0');
  const ss = String(t_.remaining%60).padStart(2,'0');
  const modeLabel = t_.mode==='pomodoro'?'集中':t_.mode==='short'?'小休憩':t_.mode==='long'?'長休憩':'カスタム';
  return `
    <div class="timer-card">
      <div class="timer-card-head"><span>${t('timer.focusSession')}</span><span class="t-jp" style="color:rgba(244,242,237,.75)">${modeLabel}</span></div>
      <div class="timer-body">
        <div class="timer-display" id="timer-display">${mm}:${ss}</div>
        <div class="timer-bar"><div class="timer-bar-fill" id="timer-bar" style="width:${pct}%"></div></div>
        ${t_.completed?`<p class="timer-complete">${t('timer.complete')}</p>`:''}
        <div class="timer-controls">
          ${t_.running
            ? `<button class="btn btn-primary" onclick="pauseTimer()"><span class="icon icon-sm">${ICONS.pause}</span> ${t('timer.pause')}</button>`
            : `<button class="btn btn-primary" onclick="startTimer()"><span class="icon icon-sm">${ICONS.play}</span> ${t('timer.start')}</button>`}
          <button class="btn" onclick="resetTimer()"><span class="icon icon-sm">${ICONS.reset}</span> ${t('timer.reset')}</button>
          <button class="btn" onclick="toggleFocus()">${t_.focus?t('timer.exitFocus'):t('timer.focus')}</button>
        </div>
        <div class="timer-settings">
          <div class="field">
            <label class="field-label">${t('timer.subject')}</label>
            <select class="select" onchange="State.timer.selectedSubject=this.value;saveTimer()">
              <option value="">— ${t('timer.none')} —</option>
              ${State.subjects.map(s=>`<option value="${esc(s)}" ${t_.selectedSubject===s?'selected':''}>${esc(s)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label class="field-label">${t('timer.sessionType')}</label>
            <select class="select" onchange="changeTimerMode(this.value)" ${t_.running?'disabled':''}>
              <option value="pomodoro" ${t_.mode==='pomodoro'?'selected':''}>${t('timer.pomodoro')} (${State.settings.pomodoro}m)</option>
              <option value="short" ${t_.mode==='short'?'selected':''}>${t('timer.short')} (${State.settings.shortBreak}m)</option>
              <option value="long" ${t_.mode==='long'?'selected':''}>${t('timer.long')} (${State.settings.longBreak}m)</option>
              <option value="custom" ${t_.mode==='custom'?'selected':''}>${t('timer.custom')}</option>
            </select>
          </div>
          ${t_.mode==='custom'?`
            <div class="field" style="grid-column:1/-1">
              <label class="field-label">${t('timer.customMinutes')}</label>
              <input class="input" type="number" min="1" max="180" value="${t_.customMin}" ${t_.running?'disabled':''} onchange="State.timer.customMin=Math.max(1,Number(this.value)||1);if(!State.timer.running){State.timer.remaining=getModeDuration('custom');State.timer.total=State.timer.remaining;saveTimer();render()}">
            </div>
          `:''}
        </div>
      </div>
    </div>
  `;
}
function startTimer(){ if(State.timer.running) return; State.timer.running = true; State.timer.completed = false; State.timer.endAt = Date.now() + State.timer.remaining*1000; saveTimer(); render(); }
function pauseTimer(){ if(!State.timer.running) return; State.timer.remaining = Math.max(0, Math.round((State.timer.endAt - Date.now())/1000)); State.timer.running = false; State.timer.endAt = null; saveTimer(); render(); }
function resetTimer(){ State.timer.running = false; State.timer.endAt = null; State.timer.completed = false; State.timer.total = getModeDuration(State.timer.mode); State.timer.remaining = State.timer.total; saveTimer(); render(); }
function changeTimerMode(mode){ if(State.timer.running) return; State.timer.mode = mode; State.timer.completed = false; State.timer.total = getModeDuration(mode); State.timer.remaining = State.timer.total; saveTimer(); render(); }
function toggleFocus(){ State.timer.focus = !State.timer.focus; render(); }
function tickTimer(){
  if(!State.timer.running) return;
  const rem = Math.max(0, Math.round((State.timer.endAt - Date.now())/1000));
  State.timer.remaining = rem;
  const el = document.getElementById('timer-display');
  if(el){
    const mm = String(Math.floor(rem/60)).padStart(2,'0');
    const ss = String(rem%60).padStart(2,'0');
    el.textContent = `${mm}:${ss}`;
    const bar = document.getElementById('timer-bar');
    if(bar) bar.style.width = (State.timer.total ? ((State.timer.total - rem)/State.timer.total*100) : 0) + '%';
  }
  if(rem <= 0) completeTimer();
}
function completeTimer(){
  if(!State.timer.running) return;
  State.timer.running = false; State.timer.endAt = null; State.timer.remaining = 0; State.timer.completed = true;
  if(State.timer.mode !== 'short' && State.timer.mode !== 'long'){
    State.sessions.push({ id:uid(), duration:State.timer.total, mode:State.timer.mode, subject:State.timer.selectedSubject, endedAt:new Date().toISOString() });
    saveSessions();
  }
  saveTimer();
  if(State.settings.soundOn) beep();
  toast(t('timer.complete'),'success');
  render();
}

/* ============================================================
   11. CALENDAR
============================================================ */
function renderCalendar(){
  const c = State.calCursor;
  const monthName = new Date(c.year, c.month, 1).toLocaleDateString(locale(), {month:'long', year:'numeric'});
  const first = new Date(c.year, c.month, 1);
  const startDay = first.getDay();
  const daysInMonth = new Date(c.year, c.month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startDay;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(`${c.year}-${String(c.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
  const byDay = {};
  State.events.forEach(e => { (byDay[e.date] = byDay[e.date] || []).push(e); });
  State.tasks.forEach(t_ => { if(t_.due && !t_.completed) { (byDay[t_.due] = byDay[t_.due] || []).push({ ...t_, isTask:true }); } });
  const sel = State.calSelected;
  const selEvents = byDay[sel] || [];

  return `

function calNav(dir){
  const c = State.calCursor;
  let month = c.month + dir, year = c.year;
  if(month < 0){ month = 11; year--; }
  if(month > 11){ month = 0; year++; }
  State.calCursor = { year, month };
  render();
}
function calToday(){
  const d = new Date();
  State.calCursor = { year:d.getFullYear(), month:d.getMonth() };
  State.calSelected = todayISO();
  render();
}
function calSelect(iso){ State.calSelected = iso; render(); }

function safeHttpUrl(u){
  try{ const x = new URL(String(u||'').trim()); return (x.protocol==='http:'||x.protocol==='https:') ? x.href : ''; }catch(e){ return ''; }
}

let booksFilter = 'all';
const BOOK_STATUSES = ['want','reading','done'];
function getBooks(){ const b = LS.get('books', []); return Array.isArray(b) ? b : []; }
function saveBooks(list){

function insertBook(b){
  const en = State.language === 'en';

  if(list.some(x => x.title.toLowerCase() === b.title.toLowerCase() && (x.author||'').toLowerCase() === (b.author||'').toLowerCase())){

  }

  if(saveBooks(list)){ toast(en ? 'Book added' : 'Buku ditambahkan', 'success'); render(); return true; }

function addBook(){
  const en = State.language === 'en';
  const title = (document.getElementById('bk-title')?.value || '').trim();
  const author = (document.getElementById('bk-author')?.value || '').trim();
  const status = document.getElementById('bk-status')?.value;

// ---- Pencarian buku online (Open Library, gratis, tanpa kunci) ----
let bookSearch = { q:'', loading:false, error:'', results:[], source:'', indoOnly: true };
let bookSearchSeq = 0, bookSearchTimer = null;
function scheduleBookSearch(){
  clearTimeout(bookSearchTimer);
  bookSearchTimer = setTimeout(() => searchBooksOnline(true), 700);
}
function bookFetch(url, ctrl){
  return fetch(url, { signal: ctrl.signal }).then(async res => {
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  });
}
// Sumber 1: Google Books (deskripsi lengkap)
async function fetchGoogleBooks(q, indo, ctrl){
  const lang = indo ? '&langRestrict=id' : '';
  const data = await bookFetch(`https://www.googleapis.com/books/v1/volumes?maxResults=6&printType=books${lang}&q=${encodeURIComponent(q)}`, ctrl);
  return (Array.isArray(data.items) ? data.items : []).map(it => {
    const v = it.volumeInfo || {};
    const desc = String(v.description || '').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
    return { title: String(v.title||'').slice(0,200), author: Array.isArray(v.authors) ? v.authors.join(', ').slice(0,120) : '',
      year: String(v.publishedDate||'').slice(0,4), desc: desc.length > 400 ? desc.slice(0,400)+'…' : desc,
      link: safeHttpUrl(v.infoLink || v.canonicalVolumeLink || '') };
  }).filter(r => r.title);
}
// Sumber 2 (cadangan): Open Library (tanpa kunci, tautan ke halaman buku)
async function fetchOpenLibrary(q, indo, ctrl){
  const lang = indo ? '&language=ind' : '';
  const data = await bookFetch(`https://openlibrary.org/search.json?limit=6&fields=key,title,author_name,first_publish_year${lang}&q=${encodeURIComponent(q)}`, ctrl);
  return (Array.isArray(data.docs) ? data.docs : []).filter(d => d && d.title).map(d => ({
    title: String(d.title).slice(0,200),
    author: Array.isArray(d.author_name) ? String(d.author_name[0]||'').slice(0,120) : '',
    year: d.first_publish_year ? String(d.first_publish_year) : '',
    desc: '',
    link: typeof d.key === 'string' && d.key.startsWith('/works/') ? safeHttpUrl('https://openlibrary.org' + d.key) : ''
  }));
}
async function searchBooksOnline(auto){
  const en = State.language === 'en';
  const q = (document.getElementById('bk-search')?.value || '').trim();
  if(q.length < 3){ if(!auto) toast(en ? 'Type at least 3 characters.' : 'Ketik minimal 3 karakter.', 'error'); return; }
  const id = ++bookSearchSeq;
  const indo = bookSearch.indoOnly !== false;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  const status = document.getElementById('bk-status-line'); if(status) status.textContent = en ? 'Searching…' : 'Mencari…';
  let results = [], source = '', errMsg = '';
  try{
    if(!navigator.onLine) throw new Error('offline');
    results = await fetchGoogleBooks(q, indo, ctrl); source = 'Google Books';
  }catch(e1){
    try{
      if(id !== bookSearchSeq) return;
      results = await fetchOpenLibrary(q, indo, ctrl); source = 'Open Library';
    }catch(e2){
      if(id !== bookSearchSeq) return;
      errMsg = e2.name === 'AbortError' ? (en ? 'The search took too long. Try again.' : 'Pencarian terlalu lama. Coba lagi.')
             : (en ? 'Both book sources are unavailable right now. Use the direct links below, or try again later.'
                   : 'Kedua sumber buku sedang tidak tersedia. Pakai tautan langsung di bawah, atau coba lagi nanti.');
    }
  }finally{ clearTimeout(timer); }
  if(id !== bookSearchSeq) return;
  bookSearch = { q, loading:false, error: errMsg, results, source, indoOnly: indo };
  render();
}
function directBookLinks(q, indo){
  const enc = encodeURIComponent(q);
  return [
    ['Google Books', `https://www.google.com/search?tbm=bks&q=${enc}${indo?'&lr=lang_id':''}`],
    ['Open Library', `https://openlibrary.org/search?q=${enc}${indo?'&language=ind':''}`],
    ['Goodreads', `https://www.goodreads.com/search?q=${enc}`],
    ['Google', `https://www.google.com/search?q=${enc}+buku`]
  ];
}

const MUSIC_MAX_BYTES = 50 * 1024 * 1024;
function getMusic(){ const m = LS.get('music', []); return Array.isArray(m) ? m : []; }
function saveMusicList(list){
  if(LS.trySet('music', list)) return true;

// Hanya URL YouTube/Spotify yang dikenali; embed dibangun dari ID yang sudah divalidasi
function parseMediaLink(raw){
  let u; try{ u = new URL(String(raw||'').trim()); }catch(e){ return null; }
  if(u.protocol !== 'https:') return null;
  const host = u.hostname.replace(/^www\./,'');
  if(host !== 'open.spotify.com') return null;
  const path = u.pathname.replace(/^\/intl-[a-z]{2}\//, '/');
  const m = path.match(/^\/(track|album|playlist|episode|show)\/([A-Za-z0-9]{22})$/);
  return m ? { provider:'spotify', embed:`https://open.spotify.com/embed/${m[1]}/${m[2]}` } : null;
}
async function addLocalTrack(file){
  const en = State.language === 'en';
  if(!file) return;
  const isAudio = (file.type && file.type.startsWith('audio/')) || /\.(mp3|m4a|wav|ogg|aac|flac)$/i.test(file.name);
  if(!isAudio){ toast(en ? 'Only audio files are allowed.' : 'Hanya file audio yang diizinkan.', 'error'); return; }
  if(file.size > MUSIC_MAX_BYTES){ toast(en ? 'File is larger than 50 MB.' : 'File lebih besar dari 50 MB.', 'error'); return; }
  const id = uid();
  try{
    await FileDB.putBlob('music:' + id, file);        // isi file dulu; jika gagal, tidak ada catatan yang dibuat
  }catch(e){
    toast(en ? 'Could not save the audio file.' : 'Gagal menyimpan file audio.', 'error'); return;
  }
  const list = getMusic();
  list.unshift({ id, kind:'local', name:String(file.name).slice(0,200), size:file.size, addedAt:Date.now() });
  if(saveMusicList(list)){ toast(en ? 'Track added' : 'Lagu ditambahkan', 'success'); render(); }
  else { try{ await FileDB.delete('music:' + id); }catch(e){} }
}
function addMediaLink(){
  const en = State.language === 'en';
  const raw = (document.getElementById('mu-link')?.value || '').trim();
  const parsed = parseMediaLink(raw);
  if(!parsed){
    toast(en ? 'Only Spotify links are supported: a track, album, or playlist from open.spotify.com.'
             : 'Hanya link Spotify yang didukung: lagu, album, atau playlist dari open.spotify.com.', 'error');
    return;
  }
  const list = getMusic();
  if(list.some(x => x.kind === 'link' && x.embed === parsed.embed)){ toast(en ? 'Already added.' : 'Sudah ditambahkan.', 'error'); return; }
  list.unshift({ id:uid(), kind:'link', provider:parsed.provider, embed:parsed.embed, url:raw.slice(0,500), addedAt:Date.now() });
  if(saveMusicList(list)){ toast(en ? 'Link added' : 'Link ditambahkan', 'success'); render(); }
}
// Pemutar disimpan di luar tampilan halaman, jadi berpindah halaman tidak menghentikan musik
let musicAudio = null, musicCurrentId = null, musicObjectUrl = null;
function getMusicAudio(){
  if(!musicAudio){
    musicAudio = new Audio();
    musicAudio.preload = 'auto';
    ['play','pause','ended','timeupdate','loadedmetadata','durationchange'].forEach(ev => musicAudio.addEventListener(ev, updateMusicUi));
    if('mediaSession' in navigator){
      const ms = navigator.mediaSession;
      ms.setActionHandler('play', () => { getMusicAudio().play().catch(() => {}); });
      ms.setActionHandler('pause', () => { getMusicAudio().pause(); });
    }
    musicAudio.addEventListener('play', syncMediaSession);
    musicAudio.addEventListener('pause', syncMediaSession);
    musicAudio.addEventListener('error', () => {
      if(musicCurrentId) toast(State.language==='en' ? 'This file could not be played.' : 'File ini tidak bisa diputar.', 'error');
      updateMusicUi();
    });
  }
  return musicAudio;
}
function fmtMusicTime(sec){
  if(!isFinite(sec) || sec < 0) return '0:00';
  return `${Math.floor(sec/60)}:${String(Math.floor(sec%60)).padStart(2,'0')}`;
}
function updateMusicUi(){
  const a = getMusicAudio();
  const en = State.language === 'en';
  const btn = document.getElementById('mu-toggle');
  if(btn){ btn.textContent = a.paused ? (en?'▶ Play':'▶ Putar') : (en?'❚❚ Pause':'❚❚ Jeda'); btn.disabled = !musicCurrentId; }
  const now = document.getElementById('mu-now');
  if(now){
    const tr = musicCurrentId ? getMusic().find(x => x.id === musicCurrentId) : null;
    now.textContent = tr ? tr.name : (en ? 'Nothing playing yet' : 'Belum ada lagu diputar');
  }
  const time = document.getElementById('mu-time');
  if(time) time.textContent = `${fmtMusicTime(a.currentTime)} / ${fmtMusicTime(a.duration)}`;
  const bar = document.getElementById('mu-bar');
  if(bar) bar.style.width = (a.duration ? (a.currentTime / a.duration * 100) : 0) + '%';
  document.querySelectorAll('[data-track-play]').forEach(b => {
    const on = b.dataset.trackPlay === musicCurrentId && !a.paused;
    b.textContent = on ? (en?'Pause':'Jeda') : (en?'Play':'Putar');
    b.setAttribute('aria-pressed', String(on));
  });
}
function syncMediaSession(){
  if(!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
  const tr = musicCurrentId ? getMusic().find(x => x.id === musicCurrentId) : null;
  navigator.mediaSession.metadata = tr ? new MediaMetadata({ title: tr.name, artist: 'Bilhatestudyright', album: 'Musik Fokus' }) : null;
  navigator.mediaSession.playbackState = getMusicAudio().paused ? 'paused' : 'playing';
}
async function playLocalTrack(id){
  const en = State.language === 'en';
  const track = getMusic().find(x => x.id === id && x.kind === 'local');
  if(!track) return;
  const a = getMusicAudio();
  try{
    const blob = await FileDB.getBlob('music:' + id);
    if(!blob) throw new Error('missing');
    if(musicObjectUrl) URL.revokeObjectURL(musicObjectUrl);
    musicObjectUrl = URL.createObjectURL(blob);
    a.src = musicObjectUrl;
    musicCurrentId = id;
    await a.play();
    syncMediaSession();
  }catch(e){
    toast(en ? 'This file could not be played. It may be missing or corrupt.' : 'File ini tidak bisa diputar. Mungkin hilang atau rusak.', 'error');
  }
  updateMusicUi();
}
function toggleMusic(){
  const a = getMusicAudio();
  if(!musicCurrentId) return;
  if(a.paused) a.play().catch(() => {}); else a.pause();
}
function trackPlayOrPause(id){
  if(musicCurrentId === id) toggleMusic(); else playLocalTrack(id);
}

      try{ await FileDB.delete('music:' + id); }catch(e){ toast(en?'Could not delete the file.':'Gagal menghapus file.', 'error'); return; }
    }
    if(id === musicCurrentId){ getMusicAudio().pause(); musicCurrentId = null; }
    if(saveMusicList(list.filter(x => x.id !== id))) render();
  });
}

// ---- Alarm: jam bunyi harian atau sekali, berbunyi saat aplikasi terbuka ----
let alarmDraft = { days: [] };
const WEEKDAYS = { id:['Min','Sen','Sel','Rab','Kam','Jum','Sab'], en:['Sun','Mon','Tue','Wed','Thu','Fri','Sat'] };
function getAlarms(){ const a = LS.get('alarms', []); return Array.isArray(a) ? a : []; }
function saveAlarms(list){
  if(LS.trySet('alarms', list)) return true;
  toast(State.language==='en' ? 'Could not save the alarm. Storage may be full.' : 'Gagal menyimpan alarm. Penyimpanan mungkin penuh.', 'error');
  return false;
}
function setAlarmDay(d){
  const set = new Set(alarmDraft.days);
  set.has(d) ? set.delete(d) : set.add(d);
  alarmDraft.days = [...set].sort();
  render();
}
function addAlarm(){
  const en = State.language === 'en';
  const time = document.getElementById('al-time')?.value || '';
  const label = (document.getElementById('al-label')?.value || '').trim().slice(0,80);
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){ toast(en ? 'Pick a valid time.' : 'Pilih jam yang valid.', 'error'); return; }
  getAudioCtx();   // sentuhan ini membuka suara untuk alarm
  const list = getAlarms();
  list.unshift({ id: uid(), time, label, days: alarmDraft.days.slice(), enabled: true, lastFired: '' });
  if(saveAlarms(list)){ alarmDraft = { days: [] }; toast(en ? 'Alarm saved' : 'Alarm disimpan', 'success'); render(); }
}
function toggleAlarm(id){
  const list = getAlarms(); const a = list.find(x => x.id === id); if(!a) return;
  a.enabled = !a.enabled; if(a.enabled) a.lastFired = '';
  if(saveAlarms(list)) render();
}
function deleteAlarm(id){
  confirmDialog(t('common.confirmDelete'), t('common.confirmDeleteBody'), () => {
    if(saveAlarms(getAlarms().filter(x => x.id !== id))) render();
  });
}
function alarmDayLabel(days){
  const en = State.language === 'en';
  if(!days || !days.length) return en ? 'Once' : 'Sekali';
  if(days.length === 7) return en ? 'Every day' : 'Setiap hari';
  return days.map(d => (en ? WEEKDAYS.en : WEEKDAYS.id)[d]).join(' · ');
}
function checkAlarms(){
  const now = new Date();
  const hhmm = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
  const today = todayISO();
  const list = getAlarms();
  let changed = false;
  for(const a of list){
    if(!a.enabled || a.time !== hhmm || a.lastFired === today) continue;
    if(a.days && a.days.length && !a.days.includes(now.getDay())) continue;
    a.lastFired = today; changed = true;
    if(!a.days || !a.days.length) a.enabled = false;   // alarm sekali langsung nonaktif setelah berbunyi
    fireAlarm(a);
  }
  if(changed) LS.trySet('alarms', list);
}
function fireAlarm(a){
  const en = State.language === 'en';
  startAlarmSound();
  const title = a.label || (en ? 'Alarm' : 'Alarm');
  if(!document.getElementById('alarm-ring')){
    const el = document.createElement('div');
    el.id = 'alarm-ring';
    el.setAttribute('role','alertdialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-labelledby','alarm-ring-title');
    el.style.cssText = 'position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:var(--s4)';
    el.innerHTML = `<div class="panel" style="padding:var(--s5);max-width:340px;width:100%;text-align:center">
      <div class="t-meta">${en?'ALARM':'ALARM'} · ${a.time}</div>
      <h2 id="alarm-ring-title" style="font-family:var(--font-display);font-size:40px;line-height:1.05;margin:var(--s2) 0 var(--s4);overflow-wrap:anywhere">${esc(title)}</h2>
      <button class="btn btn-primary" style="width:100%" onclick="dismissAlarm()">${en?'Stop':'Hentikan'}</button>
    </div>`;
    document.body.appendChild(el);
  }
  toast(en ? `Alarm: ${title}` : `Alarm: ${title}`, 'success');
  try{ if('Notification' in window && Notification.permission === 'granted') new Notification(title, { body: a.time }); }catch(e){}
}
function dismissAlarm(){
  stopAlarmSound();
  const el = document.getElementById('alarm-ring'); if(el) el.remove();
}
function renderAlarm(){
  const en = State.language === 'en';
  const list = getAlarms();
  const names = en ? WEEKDAYS.en : WEEKDAYS.id;
  return `
    <section class="panel" style="padding:var(--s4);margin-bottom:var(--s5)">
      <h3 class="t-section">${en?'New alarm':'Alarm baru'}</h3>
      <p class="t-meta" style="margin:var(--s1) 0 var(--s3);line-height:1.6">${en

      <div class="row" style="gap:var(--s3);flex-wrap:wrap;align-items:flex-end">
        <label style="display:grid;gap:var(--s1)"><span class="t-meta">${en?'Time':'Jam'}</span><input id="al-time" type="time" class="input" value="07:00" style="min-width:140px"></label>
        <label style="display:grid;gap:var(--s1);flex:1 1 200px"><span class="t-meta">${en?'Label':'Label'}</span><input id="al-label" class="input" maxlength="80" placeholder="${en?'e.g. Start studying':'mis. Mulai belajar'}"></label>
      </div>
      <div class="row" style="gap:var(--s1);flex-wrap:wrap;margin-top:var(--s3)" role="group" aria-label="${en?'Repeat days':'Hari pengulangan'}">
        ${names.map((n,i)=>`<button class="btn btn-sm" aria-pressed="${alarmDraft.days.includes(i)}" onclick="setAlarmDay(${i})" style="${alarmDraft.days.includes(i)?'background:var(--dark);color:var(--dark-fg)':''}">${n}</button>`).join('')}
      </div>
      <div class="row" style="gap:var(--s2);margin-top:var(--s4);flex-wrap:wrap">
        <button class="btn btn-primary" onclick="addAlarm()">${en?'Save alarm':'Simpan alarm'}</button>
        <button class="btn btn-sm" onclick="testSound()">${en?'Test sound':'Uji bunyi'}</button>
      </div>
    </section>

    <h3 class="t-section" style="margin-bottom:var(--s1)">${en?'Your alarms':'Alarm kamu'} (${list.length})</h3>
    <p class="t-meta" style="margin-bottom:var(--s3)">${en?'Turn an alarm off without deleting it.':'Matikan alarm tanpa menghapusnya.'}</p>
    ${list.length===0 ? `<div class="panel" style="padding:var(--s4);text-align:center"><p class="t-meta">${en?'No alarms yet.':'Belum ada alarm.'}</p></div>` : `
    <ul style="display:grid;gap:var(--s2)">
      ${list.map(a=>`<li class="panel row" style="padding:var(--s3);justify-content:space-between;gap:var(--s3);flex-wrap:wrap">
        <div style="min-width:0;flex:1 1 180px">
          <div style="font-family:var(--font-display);font-size:34px;line-height:1">${a.time}</div>
          <div style="overflow-wrap:anywhere">${esc(a.label || (en?'Alarm':'Alarm'))}</div>
          <div class="t-meta">${alarmDayLabel(a.days)}</div>
        </div>
        <button class="btn btn-sm" aria-pressed="${a.enabled}" onclick="toggleAlarm('${a.id}')">${a.enabled ? (en?'On':'Aktif') : (en?'Off':'Mati')}</button>
        <button class="btn btn-sm" onclick="deleteAlarm('${a.id}')">${en?'Delete':'Hapus'}</button>
      </li>`).join('')}
    </ul>`}`;
}

  const L = (o) => en ? o.en : o.id;
  const items = GUIDE_DATA.filter(g => !q || [L(g.t), L(g.what), ...L(g.how), L(g.tip)].join(' ').toLowerCase().includes(q));

          <ol style="margin:0 0 var(--s3) var(--s4);display:grid;gap:var(--s1);line-height:1.6">

let fileToolState = { src:null, srcUrl:'', out:null, outUrl:'', info:'', busy:false, error:'' };
function loadImageFile(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ img, url });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src = url;
  });
}
async function pickFileTool(file){
  const en = State.language === 'en';
  if(!file) return;
  if(!/^image\/(jpeg|png|webp|gif|bmp)$/.test(file.type)){ toast(en ? 'Only JPG, PNG, WebP, GIF, or BMP images.' : 'Hanya gambar JPG, PNG, WebP, GIF, atau BMP.', 'error'); return; }
  if(file.size > 25 * 1048576){ toast(en ? 'Image is larger than 25 MB.' : 'Gambar lebih besar dari 25 MB.', 'error'); return; }
  try{
    const { img, url } = await loadImageFile(file);
    if(fileToolState.srcUrl) URL.revokeObjectURL(fileToolState.srcUrl);
    if(fileToolState.outUrl) URL.revokeObjectURL(fileToolState.outUrl);
    fileToolState = { src:{ name:file.name, size:file.size, w:img.naturalWidth, h:img.naturalHeight, img }, srcUrl:url, out:null, outUrl:'', info:'', busy:false, error:'' };
    render();
  }catch(e){
    toast(en ? 'This image could not be read.' : 'Gambar ini tidak bisa dibaca.', 'error');
  }
}
async function runFileTool(){
  const en = State.language === 'en';
  const st = fileToolState;
  if(!st.src || st.busy) return;
  const maxW = Number(document.getElementById('ft-width')?.value || 0);
  const quality = Math.min(0.95, Math.max(0.3, Number(document.getElementById('ft-quality')?.value || 80) / 100));
  const fmt = document.getElementById('ft-format')?.value || 'image/jpeg';
  st.busy = true; st.error = ''; render();
  try{
    const { w, h, img } = st.src;
    const scale = maxW && w > maxW ? maxW / w : 1;
    const cw = Math.max(1, Math.round(w * scale)), ch = Math.max(1, Math.round(h * scale));
    const canvas = document.createElement('canvas');
    canvas.width = cw; canvas.height = ch;
    const ctx = canvas.getContext('2d');
    if(fmt === 'image/jpeg'){ ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cw,ch); }   // JPEG tidak punya transparansi
    ctx.drawImage(img, 0, 0, cw, ch);
    const blob = await new Promise((res, rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('encode')), fmt, quality));
    if(fileToolState.outUrl) URL.revokeObjectURL(fileToolState.outUrl);
    const ext = fmt === 'image/png' ? 'png' : fmt === 'image/webp' ? 'webp' : 'jpg';
    const base = (st.src.name || 'gambar').replace(/\.[^.]+$/, '').replace(/[^\w-]+/g,'_');
    fileToolState.out = { blob, name: `${base}_kompres.${ext}`, w: cw, h: ch };
    fileToolState.outUrl = URL.createObjectURL(blob);
    const pct = Math.round((1 - blob.size / st.src.size) * 100);
    fileToolState.info = `${fmtBytes(st.src.size)} → ${fmtBytes(blob.size)}` + (pct > 0 ? ` (${en?'smaller by':'lebih kecil'} ${pct}%)` : ` (${en?'larger, try a lower quality':'lebih besar, coba kualitas lebih rendah'})`);
  }catch(e){
    fileToolState.error = en ? 'Could not process this image. Try another format or size.' : 'Gambar tidak bisa diproses. Coba format atau ukuran lain.';
  }
  fileToolState.busy = false;
  render();
}
function clearFileTool(){
  if(fileToolState.srcUrl) URL.revokeObjectURL(fileToolState.srcUrl);
  if(fileToolState.outUrl) URL.revokeObjectURL(fileToolState.outUrl);
  fileToolState = { src:null, srcUrl:'', out:null, outUrl:'', info:'', busy:false, error:'' };
  render();
}

// ---- むちねこ: permainan lompat. Makan kari-kari = makin berat. Berat penuh = tidak bisa terbang. ----
let mchn = null;
const MCH_GOAL = 4200, MCH_GROUND_H = 60;
const INTRO_URL = 'bilhatestudyright-intro.html'; // halaman tujuan setelah keluar
function renderMuchineko(){
  const en = State.language === 'en';
  Promise.resolve().then(initMuchineko);
  return `
    <section class="panel mch-wrap" style="padding:var(--s4)">
      <div class="mch-head">
        <h2 class="mch-title">むちねこ</h2>
        <p class="t-meta">${en?'CONCEPT DESIGN':'DESAIN KONSEP'}</p>
      </div>
      <p class="mch-tag">食べたい。でも、飛べなくなる。</p>
      <canvas id="mch-canvas" width="720" height="360" class="mch-canvas" role="img" aria-label="${en?'Jumping cat game':'Permainan kucing melompat'}"></canvas>
      <div class="mch-bar">
        <div class="mch-gauge"><span class="t-meta">${en?'WEIGHT':'BERAT'}</span><div class="mch-track"><div id="mch-fill" class="mch-fill"></div></div><span id="mch-pct" class="t-meta">0%</span></div>
        <div class="row" style="gap:var(--s2);flex-wrap:wrap">
          <button class="btn btn-sm" onclick="mchPause()" id="mch-pause">${en?'Pause':'Jeda'}</button>
          <button class="btn btn-sm" onclick="initMuchineko()">${en?'Restart':'Ulang'}</button>
        </div>
      </div>
      <p class="t-meta mch-help">${en
        ? 'Tap the canvas or press Space to jump. Eat the pellets, but stay light: at 100% the cat cannot fly. Reach the can at the end.'
        : 'Ketuk kanvas atau tekan Spasi untuk melompat. Makan kari-kari, tapi tetap ringan: di 100% kucing tidak bisa terbang. Capai ujung jalan.'}</p>
    </section>`;
}
function mchSeed(n){ const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); }
function initMuchineko(){
  const cv = document.getElementById('mch-canvas'); if(!cv) return;
  if(mchn && mchn.raf) cancelAnimationFrame(mchn.raf);
  const W = cv.width, H = cv.height, groundY = H - MCH_GROUND_H;
  mchn = { cv, ctx: cv.getContext('2d'), W, H, groundY, dist:0, weight:18, y:groundY, vy:0, grounded:true,
           eaten:0, over:false, won:false, paused:false, stun:0, t:0, dust:[], items:[], blocks:[], hitBlock:{}, raf:0, last:0 };
  let x = 420, i = 0;
  while(x < MCH_GOAL){
    const r = mchSeed(i++);
    if(r < 0.55){ for(let k=0;k<3;k++) mchn.items.push({ t:'pellet', x: x + k*26, y: groundY - 70 - (k%2)*18 }); }
    else if(r < 0.8){ const bh = 40 + Math.round(mchSeed(i+7)*30), bw = 46 + Math.round(mchSeed(i+9)*40); mchn.blocks.push({ x, w:bw, h:bh, id:i }); }
    else { mchn.items.push({ t:'can', x, y: groundY - 26 }); }
    x += 150 + Math.round(mchSeed(i+3)*110);
  }
  mchn.items.push({ t:'goal', x: MCH_GOAL, y: groundY });
  cv.onpointerdown = (e) => { e.preventDefault(); mchJump(); };
  mchn.keys = (e) => { if(State.page !== 'muchineko') return; if(e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); mchJump(); } };
  document.onkeydown = mchn.keys;
  mchn.last = performance.now();
  mchn.raf = requestAnimationFrame(mchLoop);
}
function mchJump(){
  if(!mchn || mchn.over || mchn.won) return;
  if(mchn.paused){ mchPause(); return; }
  if(mchn.grounded){ mchn.vy = -(10.5 - mchn.weight * 0.035); mchn.grounded = false; }
}
function mchPause(){
  if(!mchn) return;
  mchn.paused = !mchn.paused;
  const b = document.getElementById('mch-pause'); const en = State.language === 'en';
  if(b) b.textContent = mchn.paused ? (en?'Resume':'Lanjut') : (en?'Pause':'Jeda');
}
function mchLoop(now){
  if(!mchn || !document.getElementById('mch-canvas')) return;   // halaman sudah ditutup
  mchn.raf = requestAnimationFrame(mchLoop);
  if(mchn.paused || mchn.over || mchn.won){ mchDraw(); return; }
  const m = mchn; m.t++;
  const heavy = Math.max(0, m.weight - 60);
  let speed = 2.6 - heavy * 0.025;
  if(m.stun > 0){ speed = 1.2; m.stun--; }
  speed = Math.max(0.8, speed);
  m.dist += speed;
  m.weight = Math.max(0, m.weight - 0.025);
  // fisika lompat
  m.vy += 0.5; m.y += m.vy;
  if(m.y >= m.groundY){
    if(!m.grounded && m.vy > 6){ for(let k=0;k<8;k++) m.dust.push({ x: 120+ (Math.random()*30-15), y: m.groundY, vx:(Math.random()-0.5)*3, vy:-Math.random()*2.5, life:24 }); }
    m.y = m.groundY; m.vy = 0; m.grounded = true;
  }
  const cx = m.dist + 120;   // posisi kucing di dunia
  // makanan
  for(const it of m.items){
    if(it.taken) continue;
    if(Math.abs(it.x - cx) < 22 && Math.abs(it.y - m.y) < 30){
      it.taken = true;
      if(it.t === 'pellet'){ m.weight += 4; m.eaten++; }
      else if(it.t === 'can'){ m.weight += 14; m.eaten += 3; }
      else if(it.t === 'goal'){ m.won = true; }
    }
  }
  // rintangan atap
  for(const b of m.blocks){
    if(m.hitBlock[b.id]) continue;
    const overlap = cx + 16 > b.x && cx - 16 < b.x + b.w;
    if(overlap && m.y + 8 > m.groundY - b.h){
      m.hitBlock[b.id] = true; m.weight += 6; m.stun = 40;
      m.vy = -4; m.grounded = false;
    }
  }
  if(m.weight >= 100){ m.weight = 100; m.over = true; }
  if(m.dist >= MCH_GOAL - 120){ m.won = true; }
  for(const d of m.dust){ d.x += d.vx; d.y += d.vy; d.vy += 0.15; d.life--; }
  m.dust = m.dust.filter(d => d.life > 0);
  // HUD
  const fill = document.getElementById('mch-fill'), pct = document.getElementById('mch-pct');
  if(fill) fill.style.width = Math.round(m.weight) + '%';
  if(pct) pct.textContent = Math.round(m.weight) + '%';
  mchDraw();
}
function mchDraw(){
  const m = mchn; if(!m) return;
  const c = m.ctx, W = m.W, H = m.H, gY = m.groundY;
  const en = State.language === 'en';
  // latar
  c.fillStyle = '#F6F4EE'; c.fillRect(0,0,W,H);
  // siluet kota paralaks (dua lapis)
  for(let layer=0; layer<2; layer++){
    const speed = layer === 0 ? 0.25 : 0.5, color = layer === 0 ? '#BEBAD' : '#777777';
    c.fillStyle = color;
    for(let i=0;i<22;i++){
      const bx = ((i*64 - (m.dist*speed) % 64) + 1400) % 1400 - 200;
      const bh = 60 + Math.round(mchSeed(i+layer*31)*120);
      c.fillRect(bx, gY - bh - (layer*20), 40 + (i%3)*14, bh);
    }
  }
  // tanah
  c.fillStyle = '#111111'; c.fillRect(0, gY, W, MCH_GROUND_H);
  c.fillStyle = '#333333'; c.fillRect(0, gY, W, 4);
  // rintangan atap
  for(const b of m.blocks){
    const sx = b.x - m.dist + 120; if(sx > W+80 || sx < -120) continue;
    c.fillStyle = '#333333'; c.fillRect(sx, gY - b.h, b.w, b.h);
    c.fillStyle = '#F6F4EE';
    for(let wy=gY-b.h+10; wy<gY-8; wy+=18) for(let wx=sx+8; wx<sx+b.w-12; wx+=18) c.fillRect(wx, wy, 8, 8);
  }
  // makanan & gol
  for(const it of m.items){
    if(it.taken && it.t !== 'goal') continue;
    const sx = it.x - m.dist + 120; if(sx > W+40 || sx < -40) continue;
    if(it.t === 'pellet'){ c.fillStyle = '#333333'; c.beginPath(); c.arc(sx, it.y, 7, 0, Math.PI*2); c.fill(); c.fillStyle='#BEBAD'; c.beginPath(); c.arc(sx-2, it.y-2, 2, 0, Math.PI*2); c.fill(); }
    if(it.t === 'can'){ c.fillStyle = '#777777'; c.fillRect(sx-14, it.y-10, 28, 22); c.fillStyle='#E6E1D7'; c.fillRect(sx-14, it.y-10, 28, 4); c.fillStyle='#111'; c.fillRect(sx-6, it.y, 12, 3); }
    if(it.t === 'goal'){ c.fillStyle = '#111'; c.fillRect(sx, gY - 90, 6, 90); c.fillStyle='#777'; c.fillRect(sx+6, gY-90, 40, 22); }
  }
  // debu
  c.fillStyle = '#777777';
  for(const d of m.dust){ c.globalAlpha = Math.max(0, d.life/24); c.beginPath(); c.arc(d.x, d.y, 3, 0, Math.PI*2); c.fill(); }
  c.globalAlpha = 1;
  // kucing: tubuh membesar sesuai berat, kaki bergerak saat berlari
  const bodyRx = 17 + m.weight * 0.12, bodyRy = 13 + m.weight * 0.04;
  const cy = m.y - bodyRy - 2, cxp = 120;
  const squash = m.grounded ? 1 : (m.vy < 0 ? 1.08 : 0.94);
  const wiggle = m.stun > 0 ? Math.sin(m.t * 0.8) * 3 : 0;
  c.save(); c.translate(cxp + wiggle, cy); c.scale(1/squash, squash);
  c.fillStyle = '#111111'; c.beginPath(); c.ellipse(0, 0, bodyRx, bodyRy, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#F6F4EE'; c.beginPath(); c.ellipse(bodyRx*0.25, bodyRy*0.35, bodyRx*0.45, bodyRy*0.5, 0, 0, Math.PI*2); c.fill();
  c.fillStyle = '#111111'; c.beginPath(); c.moveTo(bodyRx*0.6, -bodyRy*0.5); c.lineTo(bodyRx*0.85, -bodyRy*1.35); c.lineTo(bodyRx*0.95, -bodyRy*0.4); c.fill();
  c.fillStyle = '#F6F4EE'; c.beginPath(); c.arc(bodyRx*0.7, -bodyRy*0.25, 2.2, 0, Math.PI*2); c.fill();
  c.restore();
  // kaki
  c.strokeStyle = '#111111'; c.lineWidth = 3;
  const run = m.grounded && !m.over && !m.paused ? Math.sin(m.t*0.45) : 0;
  c.beginPath(); c.moveTo(cxp - bodyRx*0.5, m.y - 2); c.lineTo(cxp - bodyRx*0.5 + run*5, m.y + 0); c.stroke();
  c.beginPath(); c.moveTo(cxp + bodyRx*0.5, m.y - 2); c.lineTo(cxp + bodyRx*0.5 - run*5, m.y + 0); c.stroke();
  // HUD: jumlah makanan
  c.fillStyle = '#111111'; c.font = '600 14px ui-monospace, monospace'; c.textAlign = 'right';
  c.fillText('× ' + m.eaten, W - 16, 26); c.textAlign = 'left';
  // layar akhir
  if(m.over || m.won){
    c.fillStyle = 'rgba(17,17,17,.86)'; c.fillRect(0,0,W,H);
    c.fillStyle = '#F6F4EE'; c.textAlign = 'center';
    c.font = '700 34px ui-monospace, monospace';
    c.fillText(m.won ? (en?'CLEARED!':'SELESAI!') : (en?'TOO HEAVY':'TERLALU BERAT'), W/2, H/2 - 10);
    c.font = '14px ui-monospace, monospace';
    c.fillText(en ? 'Tap Restart to play again' : 'Tekan Ulang untuk main lagi', W/2, H/2 + 22);
    c.textAlign = 'left';
  }
}

// Input kosong / tidak valid tidak lagi dihitung sebagai 0
function numOrNull(id){
  const el = document.getElementById(id);
  if(!el || el.value.trim() === '') return null;
  const n = Number(el.value);
  return Number.isFinite(n) ? n : null;
}
function calcPercentChange(){
  const a = numOrNull('pc-a'), b = numOrNull('pc-b');
  const out = document.getElementById('pc-out');
  if(a === null || b === null || a === 0){ out.textContent = `${t('calc.change')}: —`; return; }
  // Pakai |a| sebagai pembagi agar tanda perubahan benar untuk nilai negatif
  out.textContent = `${t('calc.change')}: ${(((b-a)/Math.abs(a))*100).toFixed(2)}%`;
}
function calcWeightedAvg(){
  const rows = document.querySelectorAll('#avg-rows > div');
  let sumW = 0, sumWV = 0, count = 0;
  rows.forEach(r=>{
    const wEl = r.querySelector('[data-role="w"]'), vEl = r.querySelector('[data-role="v"]');
    const w = wEl && wEl.value.trim() !== '' ? Number(wEl.value) : NaN;
    const v = vEl && vEl.value.trim() !== '' ? Number(vEl.value) : NaN;
    if(Number.isFinite(w) && Number.isFinite(v) && w >= 0){ sumW += w; sumWV += w*v; count++; }
  });
  const ok = count > 0 && sumW > 0;
  document.getElementById('avg-out').textContent = `${t('calc.weightedAvg')}: ${ok ? (sumWV/sumW).toFixed(2) : '—'}`;
}
function addAvgRow(){
  const rows = document.getElementById('avg-rows');
  const div = document.createElement('div');
  div.className = 'row';
  div.style.marginBottom = 'var(--s1)';
  div.innerHTML = `<input class="input" placeholder="${t('calc.weight')}" type="number" min="0" oninput="calcWeightedAvg()" data-role="w" style="flex:1"><input class="input" placeholder="${t('calc.value')}" type="number" oninput="calcWeightedAvg()" data-role="v" style="flex:1">`;
  rows.appendChild(div);
}
function calcInterest(){
  const P = numOrNull('int-p');
  const R = numOrNull('int-r');
  const T = numOrNull('int-t');
  const ok = P !== null && R !== null && T !== null && P > 0 && R >= 0 && T >= 0;
  // Bunga 0% dan jangka 0 tahun sah: hasilnya tetap pokok
  const simple   = ok ? P*(1 + (R/100)*T) : null;
  const compound = ok ? P*Math.pow(1 + R/100, T) : null;
  document.getElementById('int-out').innerHTML = `${t('calc.simple')}: ${simple!==null?simple.toFixed(2):'—'}<br>${t('calc.compound')}: ${compound!==null?compound.toFixed(2):'—'}`;
}
function calcPV(){
  const FV = numOrNull('pv-fv');
  const R  = numOrNull('pv-r');
  const N  = numOrNull('pv-n');
  const ok = FV !== null && R !== null && N !== null && FV > 0 && R > -100 && N >= 0;
  const pv = ok ? FV / Math.pow(1 + R/100, N) : null;
  document.getElementById('pv-out').textContent = `${t('calc.presentValue')}: ${pv!==null?pv.toFixed(2):'—'}`;
}

============================================================ */
const TRANSLATE_LANGS = [
  { code:'id', labelKey:'lang.id' }, { code:'en', labelKey:'lang.en' },
  { code:'zh', labelKey:'lang.zh' }, { code:'ja', labelKey:'lang.ja' },
  { code:'ko', labelKey:'lang.ko' }, { code:'es', labelKey:'lang.es' },
  { code:'fr', labelKey:'lang.fr' },
];

// Batas aman untuk layanan MyMemory (gratis, tanpa kunci API, ~500 byte per permintaan)
const TRANS_MAX_CHARS = 450;
const TRANS_TIMEOUT_MS = 12000;
let transRequestId = 0;

function transErrorMessage(kind){
  const en = State.language === 'en';
  const msgs = {
    empty:   en ? 'Type something to translate first.' : 'Ketik teks yang mau diterjemahkan dulu.',
    tooLong: en ? `Text is too long (max ${TRANS_MAX_CHARS} characters). Split it into smaller parts.` : `Teks terlalu panjang (maksimal ${TRANS_MAX_CHARS} karakter). Pecah jadi beberapa bagian.`,
    timeout: en ? 'The translation service took too long. Check your connection and try again.' : 'Layanan terjemahan terlalu lama merespons. Cek koneksi lalu coba lagi.',
    offline: en ? 'No connection. Check your internet and try again.' : 'Tidak ada koneksi. Cek internet lalu coba lagi.',
    quota:   en ? 'The free translation limit was reached for now. Try again later.' : 'Batas gratis layanan terjemahan sudah habis untuk sementara. Coba lagi nanti.',
    badResp: en ? 'The service returned an unexpected answer. Please try again.' : 'Layanan mengirim jawaban yang tidak dikenal. Silakan coba lagi.',
    http:    en ? 'The service is unavailable right now. Try again in a moment.' : 'Layanan sedang tidak tersedia. Coba lagi sebentar lagi.'
  };
  return msgs[kind] || msgs.http;
}

async function callTranslate(text, from, to){
  const clean = (text || '').trim();
  if(!clean) throw new Error(transErrorMessage('empty'));
  if(clean.length > TRANS_MAX_CHARS) throw new Error(transErrorMessage('tooLong'));
  if(!navigator.onLine) throw new Error(transErrorMessage('offline'));

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TRANS_TIMEOUT_MS);
  let res, data;
  try {
    res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean)}&langpair=${from}|${to}`, { signal: ctrl.signal });
    if(!res.ok) throw new Error(transErrorMessage(res.status === 429 ? 'quota' : 'http'));
    data = await res.json();
  } catch(e){
    if(e.name === 'AbortError') throw new Error(transErrorMessage('timeout'));
    if(e.message && (e.message.includes('limit') || e.message.includes('habis'))) throw e;
    throw new Error(transErrorMessage('http'));
  } finally { clearTimeout(timer); }

  const status = Number(data && data.responseStatus);
  const detail = String((data && data.responseDetails) || '');
  if(status !== 200){
    if(/QUOTA|LIMIT|429/i.test(detail) || status === 429) throw new Error(transErrorMessage('quota'));
    throw new Error(transErrorMessage('http'));
  }
  const out = data.responseData && data.responseData.translatedText;
  if(typeof out !== 'string' || !out.trim()) throw new Error(transErrorMessage('badResp'));
  return out;
}

          action: tr.history.length ? `<button class="btn btn-sm" onclick="clearTransHistory()">${t('common.delete')}</button>` : ''

function onTransInput(v){ State.translator.input = v; const c = document.getElementById('trans-char-count'); if(c) c.textContent = `${v.length} ${t('notes.chars')}`; }
function clearTransInput(){ State.translator.input = ''; State.translator.output = ''; State.translator.status = 'idle'; render(); }
function swapTransLang(){
  const s = State.translator.source;
  State.translator.source = State.translator.target;
  State.translator.target = s;
  render();
}
async function doTranslate(){
  const tr = State.translator;
  if(!tr.input.trim()) { tr.status = 'error'; tr.error = transErrorMessage('empty'); render(); return; }
  if(tr.status === 'loading') return;
  const myId = ++transRequestId;
  tr.status = 'loading'; tr.output = ''; tr.error = '';
  render();
  const inputAtStart = tr.input, fromAtStart = tr.source, toAtStart = tr.target;
  try {
    const result = await callTranslate(inputAtStart, fromAtStart, toAtStart);
    if(myId !== transRequestId) return;               // respons lama, abaikan
    tr.output = result;
    tr.status = 'done';
    tr.history.unshift({ from:fromAtStart, to:toAtStart, input:inputAtStart, output:result, at:Date.now() });
    tr.history = tr.history.slice(0,50);
    saveTransHistory();
  } catch(e){
    if(myId !== transRequestId) return;
    tr.status = 'error';
    tr.error = e.message || transErrorMessage('http');  // teks input tetap dipertahankan
  }
  render();
}
function copyTransOutput(){
  if(!State.translator.output) return;
  navigator.clipboard?.writeText(State.translator.output)
    .then(()=>toast(t('trans.copied'),'success'))
    .catch(()=>toast(t('trans.copied')+' (partial)','error'));
}
function reuseTransHistory(i){
  const h = State.translator.history[i];
  if(!h) return;
  State.translator.source = h.from;
  State.translator.target = h.to;
  State.translator.input = h.input;
  State.translator.output = h.output;
  State.translator.status = 'done';
  render();
}
function clearTransHistory(){
  confirmDialog(t('common.confirmDelete'), t('common.confirmDeleteBody'), ()=>{
    State.translator.history = []; saveTransHistory(); render();
  });
}

function fileCategory(type){
  if(!type) return 'other';
  if(type.startsWith('image/')) return 'image';
  if(type === 'application/pdf') return 'pdf';
  if(type.includes('word') || type.includes('document') || type.includes('msword')) return 'doc';
  if(type.startsWith('text/') || type.includes('markdown') || type.includes('json')) return 'text';
  return 'other';
}
function fileIconSvg(cat){
  if(cat === 'image') return ICONS.image;
  if(cat === 'pdf') return ICONS.pdf;
  return ICONS.file;
}

function setupDropzone(){
  const dz = document.getElementById('dropzone');
  if(!dz) return;
  ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag-over'); }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('drag-over'); }));
  dz.addEventListener('drop', e => {
    const files = Array.from(e.dataTransfer.files || []);
    if(files.length) handleFileUpload(files);
  });
  // Thumbnails for images
  State.files.forEach(f => {
    if(fileCategory(f.type) === 'image'){
      const target = document.getElementById('thumb-' + f.id) || document.getElementById('lthumb-' + f.id);
      if(target && !target.querySelector('img')){
        FileDB.getBlob(f.id).then(blob => {
          if(!blob) return;
          const url = URL.createObjectURL(blob);
          target.innerHTML = `<img src="${url}" alt="${esc(f.name)}" loading="lazy" onload="URL.revokeObjectURL(this.src)">`;
        }).catch(()=>{});
      }
    }
  });
}

function pickFiles(){ document.getElementById('file-input')?.click(); }

async function handleFileUpload(files){
  if(!files || !files.length) return;
  for(const file of files){
    if(file.size > 50 * 1024 * 1024){
      toast(`${t('files.tooLarge')} ${file.name}`, 'error');
      continue;
    }
    const id = uid();
    const meta = {
      id, name: file.name, type: file.type || 'application/octet-stream',
      size: file.size, folderId: State.filesFolder === 'all' ? null : State.filesFolder,
      createdAt: Date.now(),
    };
    try {
      await FileDB.putMeta(meta);
      await FileDB.putBlob(id, file);
      State.files.unshift(meta);
      toast(`${t('files.uploaded')}: ${file.name}`, 'success');
    } catch(e){
      console.warn('Upload failed', e);
      toast(`${t('files.uploadFailed')}: ${file.name}`, 'error');
    }
  }
  render();
}

async function openFilePreview(id){
  const meta = State.files.find(f => f.id === id);
  if(!meta) return;
  const blob = await FileDB.getBlob(id);
  if(!blob){ toast(t('common.error'),'error'); return; }

  const cat = fileCategory(meta.type);
  const url = URL.createObjectURL(blob);
  let bodyHTML = '';

  if(cat === 'image'){
    bodyHTML = `<div class="file-preview"><img src="${url}" alt="${esc(meta.name)}" onload="URL.revokeObjectURL(this.src)"></div>`;
  } else if(cat === 'pdf'){
    bodyHTML = `<div class="file-preview"><iframe src="${url}" title="${esc(meta.name)}"></iframe></div>`;
  } else if(cat === 'text'){
    const text = await blob.text();
    const truncated = text.length > 5000 ? text.slice(0, 5000) + '\n\n… (truncated)' : text;
    bodyHTML = `<div class="file-preview"><pre>${esc(truncated)}</pre></div>`;
    URL.revokeObjectURL(url);
  } else {
    bodyHTML = `<div class="empty"><div class="empty-icon"><span class="icon-lg icon">${ICONS.file}</span></div><p class="empty-title">${esc(meta.name)}</p><p class="empty-hint">${t('files.previewUnsupported')}</p></div>`;
    URL.revokeObjectURL(url);
  }

  openModal(meta.name, `
    ${bodyHTML}
    <div class="row mt-3" style="justify-content:space-between">
      <div class="row" style="gap:var(--s2)">
        <span class="badge">${fmtBytes(meta.size)}</span>
        <span class="badge badge-soft">${new Date(meta.createdAt).toLocaleDateString(locale())}</span>
      </div>
      <div class="row" style="gap:var(--s1)">
        <button class="btn btn-sm" onclick="downloadFile('${id}')"><span class="icon icon-sm">${ICONS.download}</span> ${t('files.download')}</button>
        <button class="btn btn-sm" onclick="renameFilePrompt('${id}')"><span class="icon icon-sm">${ICONS.edit}</span> ${t('files.rename')}</button>
        <button class="btn btn-sm" onclick="deleteFileConfirm('${id}')"><span class="icon icon-sm">${ICONS.trash}</span> ${t('files.delete')}</button>
      </div>
    </div>
  `, true);
}

async function downloadFile(id){
  const meta = State.files.find(f => f.id === id);
  if(!meta) return;
  const blob = await FileDB.getBlob(id);
  if(!blob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = meta.name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function renameFilePrompt(id){
  const meta = State.files.find(f => f.id === id);
  if(!meta) return;
  openModal(t('files.renameFile'), `
    <form onsubmit="renameFileSubmit(event, '${id}')">
      <div class="field"><label class="field-label">${t('files.fileName')}</label><input class="input" required name="name" value="${esc(meta.name)}" autofocus></div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal()">${t('common.cancel')}</button>
        <button type="submit" class="btn btn-primary">${t('common.save')}</button>
      </div>
    </form>
  `);
  setTimeout(()=>document.querySelector('input[name="name"]')?.select(), 50);
}

async function renameFileSubmit(e, id){
  e.preventDefault();
  const meta = State.files.find(f => f.id === id);
  if(!meta) return;
  meta.name = e.target.name.value.trim() || meta.name;
  await FileDB.putMeta(meta);
  closeModal(); render(); toast(t('common.save'),'success');
}

function deleteFileConfirm(id){
  const meta = State.files.find(f => f.id === id);
  if(!meta) return;
  confirmDialog(t('files.deleteFileConfirm'), t('files.deleteFileBody'), async ()=>{
    try {
      await FileDB.delete(id);
      State.files = State.files.filter(f => f.id !== id);
      render(); toast('Deleted','success');
    } catch(e){ toast(t('common.error'),'error'); }
  });
}

function openFolderModal(){
  openModal(t('files.newFolder'), `
    <form onsubmit="createFolder(event)">
      <div class="field"><label class="field-label">${t('files.folderName')}</label><input class="input" required name="name" placeholder="${t('files.folderNamePlaceholder')}" autofocus></div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal()">${t('common.cancel')}</button>
        <button type="submit" class="btn btn-primary">${t('common.save')}</button>
      </div>
    </form>

}

function createFolder(e){
  e.preventDefault();
  const name = e.target.name.value.trim();
  if(!name) return;
  State.folders.push({ id: uid(), name });
  saveFolders(); closeModal(); render(); toast(t('common.save'),'success');
}

function deleteFolder(id){
  const folder = State.folders.find(f=>f.id===id);
  if(!folder) return;
  confirmDialog(t('files.deleteFolderConfirm'), t('files.deleteFolderBody'), ()=>{
    State.folders = State.folders.filter(f=>f.id!==id);
    // Move files in that folder to root
    State.files.forEach(async f => {
      if(f.folderId === id){ f.folderId = null; await FileDB.putMeta(f); }
    });
    if(State.filesFolder === id) State.filesFolder = 'all';
    saveFolders(); render(); toast('Deleted','success');

============================================================ */
// Bagian pelacak yang bisa diatur di Pengaturan. 'bySubject' default nonaktif (bisa diaktifkan kembali)
const TRACKER_SECTION_DEFAULTS = { bySubject:false };
function trackerSections(){ return { ...TRACKER_SECTION_DEFAULTS, ...(LS.get('trackerSections', {}) || {}) }; }
function trackerSectionOn(k){ return !!trackerSections()[k]; }
function setTrackerSection(k, on){ const cur = trackerSections(); cur[k] = !!on; LS.set('trackerSections', cur); render(); }
function renderTracker(){
  const today = todayISO();
  const weekStart = weekStartISO(today);
  const weekSess = State.sessions.filter(s=>localDay(s.endedAt) >= weekStart);
  const weekSec = weekSess.reduce((s,x)=>s+(x.duration||0),0);
  const weekHours = weekSec/3600;
  const weekTasks = State.tasks.filter(t_=>t_.completed && localDay(t_.completedAt) >= weekStart).length;
  const hoursPct = State.goals.weeklyHours ? Math.min(100, Math.round(weekHours/State.goals.weeklyHours*100)) : 0;
  const sessPct = State.goals.weeklySessions ? Math.min(100, Math.round(weekSess.length/State.goals.weeklySessions*100)) : 0;
  const tasksPct = State.goals.weeklyTasks ? Math.min(100, Math.round(weekTasks/State.goals.weeklyTasks*100)) : 0;

  const days = Array.from({length:7},(_,i)=>isoAddDays(today,-6+i));
  const dayMin = days.map(d=>{
    const sec = State.sessions.filter(s=>localDay(s.endedAt) === d).reduce((s,x)=>s+(x.duration||0),0);
    return Math.round(sec/60);
  });
  const maxMin = Math.max(60, ...dayMin);

  const bySubject = State.subjects.map(sub=>{
    const ts = State.tasks.filter(t_=>t_.subject === sub);
    const done = ts.filter(t_=>t_.completed).length;
    const sess = State.sessions.filter(s=>s.subject === sub);
    const sec = sess.reduce((s,x)=>s+(x.duration||0),0);
    return { sub, done, total:ts.length, sec, pct: ts.length ? Math.round(done/ts.length*100) : 0 };
  });

  return `
    <div class="filter-bar" data-aos="fade-up">
      <div>
        <p class="t-section">${t('tracker.weeklyProgress')}</p>
        <p class="t-meta" style="margin-top:var(--s1)">${t('tracker.weekOf')} ${fmtDate(weekStart)}</p>
      </div>
      <div class="spacer"></div>
      <button class="btn" onclick="openGoalsModal()">${t('tracker.editGoals')}</button>
    </div>

    <div class="grid grid-3 mb-4" data-aos="fade-up">
      ${goalCard(t('tracker.studyHours'), weekHours.toFixed(1), State.goals.weeklyHours||0, hoursPct, ICONS.timer)}
      ${goalCard(t('tracker.focusSessions'), weekSess.length, State.goals.weeklySessions||0, sessPct, ICONS.check)}
      ${goalCard(t('tracker.tasksDone'), weekTasks, State.goals.weeklyTasks||0, tasksPct, ICONS.check)}
    </div>

    <div class="mb-4" data-aos="fade-up">
      ${panel(t('tracker.last7days'), `
        <div class="week-chart">
          ${days.map((d,i)=>`
            <div class="week-chart-day">
              <span class="week-chart-val">${dayMin[i]}m</span>
              <div class="week-chart-bar" style="height:${Math.max(4,(dayMin[i]/maxMin)*100)}px"><div class="week-chart-bar-fill"></div></div>
              <span class="week-chart-label">${new Date(d+'T00:00').toLocaleDateString(locale(),{weekday:'short'}).slice(0,2)}</span>
            </div>
          `).join('')}
        </div>
      `)}
    </div>

    ${trackerSectionOn('bySubject') ? `    <div data-aos="fade-up">
      ${panel(t('tracker.bySubject'), bySubject.length ? `
        ${bySubject.map(s=>`
          <div style="margin-bottom:var(--s3)">
            <div class="subject-row"><span class="subject-name">${esc(s.sub)}</span><span class="subject-meta">${s.done}/${s.total} · ${fmtDur(s.sec)}</span></div>
            <div class="subject-bar"><div class="subject-bar-fill" style="width:${s.pct}%"></div></div>
          </div>
        `).join('')}
      ` : empty(ICONS.refs, t('tracker.noSubjects'), t('tracker.noSubjectsHint')))}
    </div>` : ''}
  `;
}
function goalCard(label, cur, target, pct, iconSvg){
  return `<div class="goal-card">
    <div class="goal-head"><span class="goal-label">${label}</span><span class="icon icon-sm">${iconSvg}</span></div>
    <div class="goal-value">${cur} <small>/ ${target}</small></div>
    <div class="goal-bar"><div class="goal-bar-fill" style="width:${pct}%"></div></div>
    <div class="goal-pct">${pct}%</div>
  </div>`;
}
function openGoalsModal(){
  openModal(t('tracker.editGoals'), `
    <form onsubmit="saveGoalsForm(event)">
      <div class="field"><label class="field-label">${t('tracker.weeklyHours')}</label><input class="input" type="number" min="0" name="weeklyHours" value="${State.goals.weeklyHours||0}"></div>
      <div class="field"><label class="field-label">${t('tracker.weeklySessions')}</label><input class="input" type="number" min="0" name="weeklySessions" value="${State.goals.weeklySessions||0}"></div>
      <div class="field"><label class="field-label">${t('tracker.weeklyTasks')}</label><input class="input" type="number" min="0" name="weeklyTasks" value="${State.goals.weeklyTasks||0}"></div>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeModal()">${t('common.cancel')}</button>
        <button type="submit" class="btn btn-primary">${t('common.save')}</button>
      </div>
    </form>
  `);
}
function saveGoalsForm(e){
  e.preventDefault();
  const f = e.target;
  State.goals = {
    weeklyHours: Math.max(0, Number(f.weeklyHours.value)||0),
    weeklySessions: Math.max(0, Number(f.weeklySessions.value)||0),
    weeklyTasks: Math.max(0, Number(f.weeklyTasks.value)||0),
  };
  saveGoals(); closeModal(); render(); toast('Saved','success');
}

// ---- Backup: localStorage + metadata & isi file (IndexedDB) ----
const BACKUP_SCHEMA = 2;
async function collectFilesForBackup(){
  const metas = await FileDB.getAllMeta();
  const files = [], missing = [];
  for(const m of metas){
    const blob = await FileDB.getBlob(m.id).catch(() => null);
    if(!blob){ missing.push(m.id); continue; }
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.readAsDataURL(blob);
    });
    files.push({ meta: m, dataUrl });
  }
  // Musik lokal: isi file ikut dicadangkan, ditandai __music
  const music = (LS.get('music', []) || []).filter(x => x && x.kind === 'local');
  for(const x of music){
    const blob = await FileDB.getBlob('music:' + x.id).catch(() => null);
    if(!blob){ missing.push('music:' + x.id); continue; }
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob);
    });
    files.push({ meta: { id: 'music:' + x.id, name: x.name, size: x.size, type: blob.type || '', addedAt: x.addedAt, __music: true }, dataUrl });
  }
  return { files, missing };
}
async function buildBackup(){
  const data = { __schema: BACKUP_SCHEMA, __exportedAt: new Date().toISOString() };
  Object.keys(localStorage).forEach(k => { if(k.startsWith('bsr.')) data[k] = localStorage.getItem(k); });
  const info = await collectFilesForBackup();   // melempar error jika ada file yang tidak bisa dibaca
  data.__files = info.files;
  data.__missingFiles = info.missing;
  return data;
}
function downloadJson(obj, name){
  const blob = new Blob([JSON.stringify(obj)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function exportAll(){
  const en = State.language === 'en';
  try{
    const data = await buildBackup();
    downloadJson(data, `bilhatestudyright-${todayISO()}.json`);
    const n = data.__files.length, miss = data.__missingFiles.length;
    if(miss) toast(en ? `Backup saved with ${n} file(s). ${miss} file record(s) had no content and were skipped.` : `Backup tersimpan dengan ${n} file. ${miss} file tanpa isi dilewati.`, 'error');
    else toast(en ? `Backup saved: data and ${n} file(s) included.` : `Backup tersimpan: data dan ${n} file ikut tercadang.`, 'success');
  }catch(e){
    console.error('[backup]', e);
    toast(en ? 'Backup failed. Nothing was downloaded.' : 'Backup gagal. Tidak ada yang diunduh.', 'error');
  }
}
// ID dipakai di atribut onclick; hanya karakter aman yang diizinkan
const SAFE_ID_RE = /^[A-Za-z0-9_-]{1,80}$/;
function idsAreSafe(v, depth){
  if(depth > 8 || v === null || typeof v !== 'object') return true;
  if(Array.isArray(v)) return v.every(x => idsAreSafe(x, depth+1));
  for(const [k, x] of Object.entries(v)){
    if(k === 'id' && typeof x === 'string' && !SAFE_ID_RE.test(x)) return false;
    if(!idsAreSafe(x, depth+1)) return false;
  }
  return true;
}
function importFile(file){
  if(!file) return;
  const en = State.language === 'en';
  const reader = new FileReader();
  reader.onerror = () => toast(en ? 'Could not read the file.' : 'File tidak bisa dibaca.', 'error');
  reader.onload = () => {
    let entries, files;
    try{
      const data = JSON.parse(reader.result);
      if(!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('shape');
      entries = Object.entries(data).filter(([k]) => k.startsWith('bsr.') && !k.startsWith('bsr.__corrupt'));
      for(const [, v] of entries){
        if(typeof v !== 'string' || v.length > 5000000) throw new Error('value');
        if(!idsAreSafe(JSON.parse(v), 0)) throw new Error('unsafe-id');
      }
      files = Array.isArray(data.__files) ? data.__files : [];
      for(const f of files){
        if(!f || !f.meta || typeof f.meta.id !== 'string' || typeof f.meta.name !== 'string' || typeof f.dataUrl !== 'string' || !f.dataUrl.startsWith('data:'))
          throw new Error('file');
      }
      if(!entries.length && !files.length) throw new Error('empty');
    }catch(e){
      toast(t('settings.invalidFile'), 'error');
      return;
    }
    confirmDialog(
      en ? 'Replace current data?' : 'Ganti data saat ini?',
      en ? `Will import ${entries.length} data record(s) and ${files.length} file(s). A safety backup of your current data (including files) is downloaded first.`
         : `Akan mengimpor ${entries.length} data dan ${files.length} file. Cadangan pengaman dari data sekarang (termasuk file) diunduh dulu.`,
      () => applyImport(entries, files)
    );
  };
  reader.readAsText(file);
}
function restoreLocalSnapshot(snapshot){
  try{
    Object.keys(localStorage).forEach(k => { if(k.startsWith('bsr.')) localStorage.removeItem(k); });
    Object.entries(snapshot).forEach(([k, v]) => localStorage.setItem(k, v));
  }catch(_){}
}
async function replaceFileStores(staged){
  const db = await FileDB.open();
  await new Promise((res, rej) => {
    const tx = db.transaction(['meta','blobs'], 'readwrite');
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error || new Error('aborted'));
    tx.objectStore('meta').clear();
    tx.objectStore('blobs').clear();
    for(const f of staged){
      if(!f.meta.__music) tx.objectStore('meta').put(f.meta);
      tx.objectStore('blobs').put({ id: f.meta.id, blob: f.blob });
    }
  });
}
async function applyImport(entries, files){
  const en = State.language === 'en';
  // 1. Cadangan pengaman dari data sekarang; jika gagal, impor dibatalkan
  let safety;
  try{ safety = await buildBackup(); }
  catch(e){
    toast(en ? 'Could not prepare the safety backup. Import cancelled, data kept.' : 'Cadangan pengaman gagal dibuat. Impor dibatalkan, data dipertahankan.', 'error');
    return;
  }
  downloadJson(safety, `bilhatestudyright-cadangan-sebelum-impor-${Date.now()}.json`);
  // 2. Siapkan (stage) semua blob dulu; jika ada yang rusak, tidak ada yang ditulis
  let staged;
  try{
    staged = await Promise.all(files.map(async f => ({ meta: f.meta, blob: await (await fetch(f.dataUrl)).blob() })));
  }catch(e){
    toast(en ? 'Some file contents are corrupt. Import cancelled, data kept.' : 'Isi sebagian file rusak. Impor dibatalkan, data dipertahankan.', 'error');
    return;
  }
  // 3. Tulis localStorage dengan rollback
  const snapshot = {};
  Object.keys(localStorage).forEach(k => { if(k.startsWith('bsr.')) snapshot[k] = localStorage.getItem(k); });
  try{
    Object.keys(snapshot).forEach(k => localStorage.removeItem(k));
    entries.forEach(([k, v]) => localStorage.setItem(k, v));
  }catch(e){
    restoreLocalSnapshot(snapshot);
    toast(en ? 'Import failed (storage full?). Your data was kept.' : 'Impor gagal (penyimpanan penuh?). Data kamu dipertahankan.', 'error');
    return;
  }
  // 4. Tulis file dalam satu transaksi; jika gagal, kembalikan localStorage
  try{
    await replaceFileStores(staged);
  }catch(e){
    restoreLocalSnapshot(snapshot);
    toast(en ? 'File restore failed. Your previous data was kept.' : 'Pemulihan file gagal. Data sebelumnya dipertahankan.', 'error');
    return;
  }
  toast(en ? `Imported ${entries.length} data record(s) and ${staged.length} file(s). Reloading…` : `${entries.length} data dan ${staged.length} file berhasil diimpor. Memuat ulang…`, 'success');
  setTimeout(() => location.reload(), 900);
}
function resetAll(){
  confirmDialog(t('settings.resetConfirm'), t('settings.resetConfirmBody'), async ()=>{
    Object.keys(localStorage).forEach(k=>{ if(k.startsWith('bsr.')) localStorage.removeItem(k); });
    try {
      const db = await FileDB.open();
      const tx = db.transaction(['meta','blobs'],'readwrite');
      tx.objectStore('meta').clear();
      tx.objectStore('blobs').clear();
    } catch(e){}
    toast(t('settings.resetting'),'success');
    setTimeout(()=>location.reload(), 600);
  });
}

function runSearch(q){
  const el = document.getElementById('search-results');
  if(!el) return;
  if(!q.trim()){ el.innerHTML = `<p class="t-meta" style="text-align:center;padding:var(--s4)">${t('search.hint')}</p>`; return; }
  const ql = q.toLowerCase();
  const results = [];
  State.notes.forEach(n=>{ if((n.title||'').toLowerCase().includes(ql) || (n.content||'').toLowerCase().includes(ql)) results.push({ kind:'note', title:n.title||t('notes.untitled'), sub:n.folder, action:()=>{ nav('notes'); setTimeout(()=>{ State.activeNoteId=n.id; render(); },30); } }); });
  State.tasks.forEach(t_=>{ if((t_.title||'').toLowerCase().includes(ql)) results.push({ kind:'task', title:t_.title, sub:t_.due||'', action:()=>nav('tasks') }); });
  State.events.forEach(e=>{ if((e.title||'').toLowerCase().includes(ql)) results.push({ kind:'event', title:e.title, sub:`${fmtDate(e.date)} ${fmtTime12(e.start)}`, action:()=>nav('schedule') }); });
  State.references.forEach(r=>{ if((r.title||'').toLowerCase().includes(ql) || (r.author||'').toLowerCase().includes(ql)) results.push({ kind:'reference', title:r.title, sub:r.author, action:()=>nav('references') }); });
  State.files.forEach(f=>{ if((f.name||'').toLowerCase().includes(ql)) results.push({ kind:'file', title:f.name, sub:fmtBytes(f.size), action:()=>{ nav('files'); setTimeout(()=>openFilePreview(f.id), 60); } }); });

  if(results.length === 0){ el.innerHTML = `<p class="t-meta" style="text-align:center;padding:var(--s4)">${t('search.noResults')}</p>`; return; }
  el.innerHTML = results.slice(0,30).map((r,i)=>`
    <button onclick="window.__searchResults[${i}]()" style="width:100%;text-align:left;border:1px solid var(--border);padding:var(--s2) var(--s3);margin-bottom:var(--s1);background:var(--surface);display:flex;gap:var(--s2);align-items:center;font-family:inherit;color:inherit">
      <span class="badge badge-dark" style="min-width:70px;justify-content:center">${r.kind}</span>
      <span style="font-weight:600;font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}</span>
      <span class="t-meta" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px">${esc(r.sub||'')}</span>
    </button>
  `).join('');
  window.__searchResults = results.map(r => () => { closeModal(); r.action(); });
}
